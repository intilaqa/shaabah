# يُبقي قاعدة بيانات Supabase نشطة: يقرأ منها مرتين يوميًا حتى لا تتوقف بسبب عدم الاستخدام
name: keep-supabase-awake
on:
  schedule:
    - cron: "17 5,17 * * *"
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/sections_public?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY")
          echo "Supabase replied: $code"
          test "$code" = "200"
