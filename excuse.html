<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17707a">
<title>شعبتي</title>
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one question per card, like a short chat; progress bar on top; big tappable chips */
:root{
  --bg:#f2f5f4;--surface:#fff;--ink:#15262a;--muted:#5b6c70;--line:#dbe3e2;--line-strong:#b8c7c6;
  --accent:#17707a;--accent-ink:#fff;--accent-soft:#dff0ef;--deny:#b42318;--deny-soft:#fcebe9;--ok:#2b7a4b;--ok-soft:#e2f2e7;
  --s1:#fde8c8;--s2:#d3ecea;
  --f-hero:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517;--surface:#152124;--ink:#e4eeed;--muted:#93a6a8;--line:#243437;--line-strong:#3a4e51;
  --accent:#5fc0c6;--accent-ink:#0a1a1c;--accent-soft:#163338;--deny:#ff8b7e;--deny-soft:#3a1c19;--ok:#6fcf97;--ok-soft:#173022;--s1:#3a2e1f;--s2:#173335;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1517;--surface:#152124;--ink:#e4eeed;--muted:#93a6a8;--line:#243437;--line-strong:#3a4e51;
  --accent:#5fc0c6;--accent-ink:#0a1a1c;--accent-soft:#163338;--deny:#ff8b7e;--deny-soft:#3a1c19;--ok:#6fcf97;--ok-soft:#173022;--s1:#3a2e1f;--s2:#173335;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--s1),var(--s2) 60%,var(--bg));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-hero);font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.prog{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;opacity:.9}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
.card{background:var(--surface);border-radius:22px;padding:22px 18px;box-shadow:0 18px 40px -26px rgba(21,38,42,.45);display:flex;flex-direction:column;gap:16px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.prog i{transition:none}}
h1{font-family:var(--f-hero);font-size:1.75rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--f-hero);font-size:1.3rem;margin:0;line-height:1.35}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:.82rem;font-weight:600;color:var(--muted)}
.f input,.f textarea{border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:12px 14px;width:100%;font-size:1rem}
.f textarea{min-height:130px;resize:vertical}
.chips{display:grid;gap:8px}
.chips.two{grid-template-columns:1fr 1fr}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;text-align:start;display:flex;gap:10px;align-items:center;font-weight:600;min-height:54px}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.chip .e{font-size:1.4rem;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);min-width:120px}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:8px}
.att{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:14px;padding:12px;position:relative}
.att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.att .e{font-size:1.5rem}
.att .x{position:relative;z-index:1;background:none;border:0;color:var(--deny);font-weight:700;margin-inline-start:auto}
.review{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.review dt{color:var(--muted)}.review dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.err{background:var(--deny-soft);color:var(--deny);border-radius:12px;padding:10px 12px;font-size:.9rem}
.done{text-align:center;align-items:center}
.done .big{font-size:3.4rem;line-height:1}
.ref{font-family:var(--f-hero);font-size:1.6rem;letter-spacing:.1em;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:6px 18px;direction:ltr}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.plate{background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;min-width:96px;text-align:center;display:flex;flex-direction:column;gap:2px}
.plate small{font-size:.7rem;opacity:.7;font-weight:600}.plate b{font-size:1.5rem;line-height:1.15;direction:ltr;unicode-bidi:isolate;word-break:break-word}
.go{font-family:var(--f-hero);font-size:1.25rem;font-weight:700;line-height:1.35}
.go bdi{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.ann{background:var(--accent-soft);border-radius:14px;padding:12px 14px;line-height:1.7}
.ann.cx{background:var(--deny-soft);color:var(--deny)}
.ann small{display:block;color:var(--muted);font-size:.78rem}
.wk{display:flex;flex-direction:column;gap:6px}
.wk div{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:.92rem}
.wk div.t{outline:2px solid var(--accent)}
.wk b{font-weight:700}.wk .rm{background:var(--ink);color:var(--surface);border-radius:6px;padding:0 7px;font-size:.78rem;font-weight:700;direction:ltr}
.row2{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.greet h1{font-size:1.6rem}.greet p{margin:4px 0 0}
.wait{font-size:.95rem;color:var(--accent);font-weight:600;margin-top:2px}
.dh{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.dh .k{font-size:.72rem;font-weight:700;color:var(--accent)}
.dh .t{font-family:"Amiri",serif;font-size:1.35rem;line-height:1.9;margin:0}
.dh .s2{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.dh button{background:none;border:0;color:var(--accent);font-weight:700;font-size:.85rem}
.nm{display:flex;gap:8px;align-items:end}.nm .f{flex:1}
.foot{margin-top:auto;text-align:center;color:var(--muted);font-size:.8rem}
.foot b{font-family:var(--f-hero);color:var(--accent)}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent-ink);display:inline-block;vertical-align:-3px;animation:sp 1s linear infinite;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
  <div class="top"><span class="brand" id="brand"><i></i>شعبتي</span><span id="step" class="sub num"></span></div>
  <div class="prog" aria-hidden="true"><i id="bar" style="width:0"></i></div>
  <main id="view"></main>
  <p class="foot">فكرة وتصميم — <b>نعيمه الرشيدي</b></p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KINDS=[['🤒','مرضي'],['🖤','وفاة'],['🏠','ظرف عائلي'],['📄','موعد رسمي'],['✏️','أخرى']];
const STEPS=['welcome','who','sec','lec','kind','text','review'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const t12=t=>{if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(m)+' '+ap};
let fD;try{fD=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long'})}catch(e){fD=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long'})}
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toEn=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const me=ls.get('exc.me')||{};
const S={mode:'home',mySec:ls.get('exc.sec')||'',ann:[],i:0,name:me.name||'',uid:me.uid||'',sec:null,lec:null,kind:'',body:'',file:null,fileName:'',sections:null,err:'',sending:false,ref:''};
const CFG=window.REG_CONFIG||{};
let sb=null;try{if(CFG.url&&CFG.key&&window.supabase)sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:false}})}catch(e){}

async function loadSections(){
  if(window.DEMO_SECTIONS){S.sections=DEMO_SECTIONS;render();return}
  if(!sb){S.err='الصفحة غير مرتبطة بعد. أخبري أستاذتك.';S.sections=[];render();return}
  const {data,error}=await sb.from('sections_public').select('*').order('name');
  const an=await sb.from('announcements').select('*').order('created_at',{ascending:false}).limit(50);if(!an.error)S.ann=an.data||[];
  if(error){S.err=navigator.onLine===false?'لا يوجد اتصال بالإنترنت. اتصلي ثم أعيدي فتح الصفحة.':'تعذّر تحميل الشعب، حاولي بعد قليل.';S.sections=[]}
  else S.sections=data||[];render();
}
function lectures(sec){
  if(!sec)return[];const out=[],today=new Date();today.setHours(0,0,0,0);
  const start=sec.term_start?pd(sec.term_start):new Date(today-60*864e5);
  for(let k=0;k<35;k++){const d=new Date(today);d.setDate(d.getDate()-k);if(d<start)break;
    for(const m of (sec.meetings||[]).filter(m=>m.day===d.getDay()).sort((a,b)=>a.start<b.start?-1:1))out.push({date:ymd(d),m,k})}
  return out;
}
function rel(k,d){return k===0?'اليوم':k===1?'أمس':DAYS[d.getDay()]}
function canNext(){const s=STEPS[S.i];
  if(s==='who')return S.name.trim().split(/\s+/).length>=2&&/^\d{5,12}$/.test(toEn(S.uid).trim());
  if(s==='sec')return !!S.sec;if(s==='lec')return !!S.lec;if(s==='kind')return !!S.kind;if(s==='text')return S.body.trim().length>=2;return true}
const ENC={morning:['ابدئي يومك ببسم الله، والباقي على الله','صباحك همّة ونشاط، وكل محاضرة خطوة لحلمك','توكلي على الله، يومك بإذن الله موفق','قهوتك وقلمك جاهزين؟ يلا نبدأ 💪'],
  noon:['نص اليوم راح، وباقي أجمله','خذي نفس، أنتِ أقرب لهدفك مما تتوقعين','الاستمرار أهم من الكمال، كمّلي'],
  after:['يعطيك العافية على تعب اليوم','ما يضيع تعب، الله يكتب أجرك ويحقق حلمك','راجعي اللي أخذتيه اليوم ولو خمس دقايق'],
  night:['نامي بدري، بكرة يومك أجمل','أغلقي يومك بالحمد والدعاء','تصبحين على خير وراحة بال']};
const DH=[{k:'دعاء',t:'رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي',s:'سورة طه: ٢٥–٢٦'},{k:'آية',t:'وَقُل رَّبِّ زِدْنِي عِلْمًا',s:'سورة طه: ١١٤'},{k:'آية',t:'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا',s:'سورة الشرح: ٥'},
  {k:'دعاء',t:'اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحَزْن إذا شئت سهلًا',s:''},{k:'آية',t:'وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ',s:'سورة هود: ٨٨'},
  {k:'حديث',t:'من سلك طريقًا يلتمس فيه علمًا، سهّل الله له به طريقًا إلى الجنة',s:'رواه مسلم'},{k:'ذكر',t:'لا حول ولا قوة إلا بالله',s:''},{k:'آية',t:'أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',s:'سورة الرعد: ٢٨'},
  {k:'دعاء',t:'اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا',s:''},{k:'ذكر',t:'بسم الله، توكلت على الله',s:''}];
let dhi=Math.floor(Math.random()*DH.length);
const dur=n=>n<60?`${n} دقيقة`:n<1440?`${Math.floor(n/60)} س${n%60?' و'+(n%60)+' د':''}`:`${Math.round(n/1440)} يوم`;
const mins=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return h*60+m};
function nextLecture(sec){const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  for(let k=0;k<14;k++){const d=new Date(now);d.setDate(d.getDate()+k);const ds=ymd(d);
    const L=(sec.meetings||[]).filter(m=>m.day===d.getDay()).sort((a,b)=>a.start<b.start?-1:1);
    for(const m of L){const end=mins(m.end)||mins(m.start)+Math.round((m.hours||1)*50);if(k===0&&end<=nowM)continue;
      const cx=(sec.cancelled||[]).find(c=>c.date===ds&&c.meeting_id===m.id);
      return{d,ds,m,k,cx,now:k===0&&mins(m.start)<=nowM,inMin:k===0?mins(m.start)-nowM:null}}}return null}
function portal(){
  const v=$('view');$('bar').style.width='0';$('step').textContent='';$('brand').lastChild.textContent='شعبتي';
  if(S.sections===null){v.innerHTML='<section class="card"><p class="sub"><span class="spin" style="border-top-color:var(--accent)"></span>لحظة…</p></section>';return}
  const sec=S.sections.find(x=>x.id===S.mySec);
  if(!sec||S.mode==='pick'){v.innerHTML=`<section class="card"><h1>أهلًا بك 🌿</h1><p class="sub">اختاري شعبتك مرة واحدة، وتشوفين محاضراتك وقاعاتها والإعلانات كل ما فتحتِ الصفحة.</p><div class="f"><label for="pn">وش نناديك؟ (اختياري)</label><input id="pn" data-k="name" value="${esc(S.name)}" placeholder="اسمك الأول"></div>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<div class="chips">${S.sections.map(x=>`<button class="chip" data-a="mysec" data-v="${esc(x.id)}"><span>${esc(x.name)}</span></button>`).join('')}</div></section>`;return}
  const n=nextLecture(sec);let top='';
  const hr=new Date().getHours(),tod=hr<11?'morning':hr<15?'noon':hr<18?'after':'night';
  const first=(S.name||'').trim().split(/\s+/)[0];const T=sec.teacher||'أستاذتك';
  const hello=(hr<12?'صباح الخير':hr<18?'مساء النور':'مساء الخير')+(first?' يا '+first:'')+' 🌿';
  const L=ENC[tod],enc=L[Math.floor(Date.now()/36e5)%L.length];
  const doneToday=!n||n.k>0;const todayHad=(sec.meetings||[]).some(m=>m.day===new Date().getDay());
  if(n){const when=n.now?'الآن':n.k===0?`اليوم ${t12(n.m.start)} · بعد ${dur(n.inMin)}`:`${n.k===1?'بكرة':DAYS[n.d.getDay()]} ${esc(fD.format(n.d))} · ${t12(n.m.start)}`;
    top=n.cx?`<div class="ann cx">❌ محاضرة ${esc(when)} <b>مُلغاة</b>${n.cx.reason?' ('+esc(n.cx.reason)+')':''}</div>`
      :`<div class="hero"><div class="plate"><small>القاعة</small><b>${esc(n.m.room||'—')}</b></div><div><div class="go">${n.now?'محاضرتك الآن، أسرعي!':n.m.room?`يلا على قاعة <bdi>${esc(n.m.room)}</bdi>`:'محاضرتك القادمة'}</div><div class="sub num">${when}</div>${n.k===0?`<div class="wait">${esc(T)} تنتظرك 🌷</div>`:''}</div></div>`}
  if(doneToday&&todayHad)top=`<div class="ann">✨ خلصتِ محاضرة اليوم، يعطيك العافية!</div>`+top;
  const today=ymd(new Date());
  const anns=S.ann.filter(a=>(!a.section_id||a.section_id===sec.id)&&(!a.until||a.until>=today));
  const cxs=(sec.cancelled||[]).filter(c=>c.date>=today);
  const dow=new Date().getDay();
  const wk=[0,1,2,3,4].flatMap(d=>(sec.meetings||[]).filter(m=>m.day===d).sort((a,b)=>a.start<b.start?-1:1).map(m=>`<div class="${d===dow?'t':''}"><b>${DAYS[d]}</b><span class="num">${t12(m.start)}${m.end?' – '+t12(m.end):''}</span>${m.room?`<span class="rm">${esc(m.room)}</span>`:'<span></span>'}</div>`)).join('');
  const d=DH[dhi%DH.length];
  v.innerHTML=`<section class="card"><div class="greet"><h1>${esc(hello)}</h1><p class="sub">${esc(enc)}</p></div>${top}<p class="sub" style="font-size:.85rem">${esc(sec.name)}${sec.teacher?' · '+esc(sec.teacher):''}</p>
   ${anns.length||cxs.length?`<div class="wk">${cxs.map(c=>{const m=(sec.meetings||[]).find(x=>x.id===c.meeting_id);return `<div class="ann cx" style="display:block">❌ أُلغيت محاضرة ${esc(DAYS[pd(c.date).getDay()]+' '+fD.format(pd(c.date)))}${m?' '+t12(m.start):''}${c.reason?' · '+esc(c.reason):''}</div>`}).join('')}${anns.map(a=>`<div class="ann" style="display:block">📢 ${esc(a.body)}<small class="num">${esc(fD.format(new Date(a.created_at)))}</small></div>`).join('')}</div>`:''}
   <div><p class="sub" style="font-weight:600;margin-bottom:6px">جدول الشعبة</p><div class="wk">${wk||'<p class="sub">لا مواعيد.</p>'}</div></div>
   <div class="row2"><button class="btn" data-a="excuse">📩 عندي عذر</button><button class="btn ghost" data-a="pick">تغيير الشعبة</button></div>
   <div class="dh"><span class="k">${esc(d.k)}</span><p class="t">${esc(d.t)}</p><div class="s2"><span>${esc(d.s)}</span><button data-a="dh">التالي ←</button></div></div></section>`;
}
function render(){
  if(S.mode!=='form'&&!S.ref)return portal();
  $('brand').lastChild.textContent='تقديم عذر غياب';
  const s=STEPS[S.i],v=$('view');
  $('bar').style.width=(S.ref?100:Math.round(S.i/(STEPS.length-1)*100))+'%';
  $('step').textContent=S.ref||S.i===0?'':`${S.i} من ${STEPS.length-1}`;
  if(S.ref){v.innerHTML=`<section class="card done"><div class="big">✅</div><h1>وصل عذرك</h1><p class="sub">شكرًا لك، وستتم مراجعته قريبًا بإذن الله.</p><span class="sub">رقم الطلب</span><span class="ref">${esc(S.ref)}</span><p class="sub">احتفظي به إذا احتجتِ تتابعين مع أستاذتك.</p><div class="row2" style="justify-content:center"><button class="btn" data-a="home">العودة لشعبتي</button><button class="btn ghost" data-a="again">إرسال عذر آخر</button></div></section>`;return}
  let h='';
  if(s==='welcome')h=`<h1>عندك عذر؟<br>أرسليه في دقيقة 🌿</h1><p class="sub">بدون تحميل ولا تسجيل دخول. اكتبي عذرك، وإذا عندك ما يثبته صوّريه وأرفقيه.</p>${S.err?`<div class="err">${esc(S.err)}</div>`:''}<div class="nav"><span></span><button class="btn" data-a="next"${S.sections===null?' disabled':''}>${S.sections===null?'<span class="spin"></span>لحظة…':'ابدئي'}</button></div>`;
  else if(s==='who')h=`<h2>عرّفينا بنفسك</h2><div class="f"><label for="n">الاسم الكامل</label><input id="n" data-k="name" value="${esc(S.name)}" autocomplete="name" placeholder="الاسم الثلاثي"></div><div class="f"><label for="u">الرقم الجامعي</label><input id="u" data-k="uid" value="${esc(S.uid)}" inputmode="numeric" dir="ltr" placeholder="443xxxxxx"></div>`;
  else if(s==='sec')h=`<h2>في أي شعبة؟</h2>${S.sections.length?`<div class="chips">${S.sections.map(x=>`<button class="chip" data-a="sec" data-v="${esc(x.id)}" aria-pressed="${S.sec&&S.sec.id===x.id}"><span>${esc(x.name)}</span></button>`).join('')}</div>`:`<div class="err">${esc(S.err||'لا توجد شعب متاحة الآن.')}</div>`}`;
  else if(s==='lec'){const L=lectures(S.sec);h=`<h2>أي محاضرة غبتِ عنها؟</h2><p class="sub">${esc(S.sec.short||S.sec.name)} · آخر خمسة أسابيع</p>${L.length?`<div class="chips two">${L.map(l=>{const d=pd(l.date),key=l.date+'|'+l.m.id;return `<button class="chip" data-a="lec" data-v="${key}" aria-pressed="${S.lec&&S.lec.key===key}"><span>${rel(l.k,d)}<small class="num">${esc(fD.format(d))} · ${t12(l.m.start)}</small></span></button>`}).join('')}</div>`:'<div class="err">لا توجد محاضرات سابقة لهذه الشعبة.</div>'}`}
  else if(s==='kind')h=`<h2>ما نوع العذر؟</h2><div class="chips two">${KINDS.map(([e,t])=>`<button class="chip" data-a="kind" data-v="${t}" aria-pressed="${S.kind===t}"><span class="e">${e}</span><span>${t}</span></button>`).join('')}</div>`;
  else if(s==='text')h=`<h2>اكتبي عذرك</h2><div class="f"><label for="b">باختصار، ما الذي حدث؟</label><textarea id="b" data-k="body" maxlength="2000" placeholder="مثال: راجعت المستشفى بسبب ارتفاع الحرارة">${esc(S.body)}</textarea></div>
    <div class="att">${S.file?`<span class="e">📎</span><span>${esc(S.fileName)}</span><button class="x" data-a="rmfile">حذف</button>`:`<span class="e">📷</span><span>إرفاق صورة أو ملف <small class="sub">(اختياري)</small></span><input type="file" id="fl" accept="image/*,application/pdf" aria-label="إرفاق صورة أو ملف">`}</div>`;
  else if(s==='review')h=`<h2>راجعي قبل الإرسال</h2><dl class="review"><dt>الاسم</dt><dd>${esc(S.name)}</dd><dt>الرقم</dt><dd class="num">${esc(toEn(S.uid))}</dd><dt>الشعبة</dt><dd>${esc(S.sec.name)}</dd><dt>المحاضرة</dt><dd class="num">${esc(DAYS[pd(S.lec.date).getDay()]+' '+fD.format(pd(S.lec.date))+' · '+t12(S.lec.m.start))}</dd><dt>النوع</dt><dd>${esc(S.kind)}</dd><dt>العذر</dt><dd>${esc(S.body)}</dd><dt>المرفق</dt><dd>${S.file?'📎 '+esc(S.fileName):'لا يوجد'}</dd></dl>${S.err?`<div class="err">${esc(S.err)}</div>`:''}`;
  if(s!=='welcome')h+=`<div class="nav"><button class="back" data-a="${S.i<=1?'home':'back'}">→ ${S.i<=1?'إلغاء':'رجوع'}</button><button class="btn" data-a="${s==='review'?'send':'next'}"${canNext()&&!S.sending?'':' disabled'}>${s==='review'?(S.sending?'<span class="spin"></span>جارٍ الإرسال':'إرسال العذر'):'التالي'}</button></div>`;
  v.innerHTML=`<section class="card">${h}</section>`;
  const f=v.querySelector('input:not([type=file]),textarea');if(f&&!('ontouchstart' in window))f.focus();
}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;S[k]=e.target.value;const b=document.querySelector('[data-a=next],[data-a=send]');if(b)b.disabled=!canNext()});
document.addEventListener('change',async e=>{if(e.target.id!=='fl')return;const f=e.target.files[0];if(!f)return;
  try{if(f.type==='application/pdf'){if(f.size>3*1024*1024){alertErr('الملف أكبر من ٣ ميجا');return}S.file=f;S.fileName=f.name}
    else{S.file=await shrink(f);S.fileName=f.name.replace(/\.\w+$/,'')+'.jpg'}}catch(_){alertErr('تعذّرت قراءة الصورة، جرّبي صورة أخرى')}
  render()});
function alertErr(t){S.err=t;render();setTimeout(()=>{S.err='';},4000)}
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1600,r=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.72)};img.onerror=no;img.src=u})}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='dh'){dhi++;render();return}
  if(a==='mysec'){S.mySec=t.dataset.v;ls.set('exc.sec',S.mySec);if(S.name.trim())ls.set('exc.me',{...(ls.get('exc.me')||{}),name:S.name.trim()});S.mode='home';render();return}
  if(a==='pick'){S.mode='pick';render();return}
  if(a==='home'){S.mode='home';S.ref='';S.i=0;S.err='';render();window.scrollTo(0,0);return}
  if(a==='excuse'){S.mode='form';S.i=1;S.sec=S.sections.find(x=>x.id===S.mySec)||null;S.lec=null;S.kind='';S.body='';S.file=null;S.fileName='';S.ref='';render();window.scrollTo(0,0);return}
  if(a==='next'&&canNext()){S.err='';S.i++;if(STEPS[S.i]==='sec'&&S.sec)S.i++;render();window.scrollTo(0,0)}
  else if(a==='back'){S.i=Math.max(1,S.i-1);if(STEPS[S.i]==='sec'&&S.sec&&S.sec.id===S.mySec)S.i--;S.err='';render()}
  else if(a==='sec'){S.sec=S.sections.find(x=>x.id===t.dataset.v);S.lec=null;render()}
  else if(a==='lec'){const[date,mid]=t.dataset.v.split('|');S.lec={key:t.dataset.v,date,m:S.sec.meetings.find(m=>m.id===mid)};render()}
  else if(a==='kind'){S.kind=t.dataset.v;render()}
  else if(a==='rmfile'){S.file=null;S.fileName='';render()}
  else if(a==='again'){Object.assign(S,{mode:'form',i:1,sec:null,lec:null,kind:'',body:'',file:null,fileName:'',ref:'',err:''});render()}
  else if(a==='send')send();
});
async function send(){
  if(S.sending)return;if(navigator.onLine===false){alertErr('لا يوجد اتصال بالإنترنت. اتصلي ثم اضغطي إرسال.');return}
  if(!sb){alertErr('الصفحة غير مرتبطة بعد.');return}
  S.sending=true;S.err='';render();
  const id=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)));
  try{let file_path=null;
    if(S.file){file_path=`${S.sec.id}/${id}.${S.file.type==='application/pdf'?'pdf':'jpg'}`;
      const up=await sb.storage.from('excuse-files').upload(file_path,S.file,{contentType:S.file.type||'image/jpeg',upsert:false});if(up.error)throw up.error}
    const {error}=await sb.from('excuses').insert({id,student_name:S.name.trim().replace(/\s+/g,' '),student_uid:toEn(S.uid).trim(),section_id:S.sec.id,lecture_date:S.lec.date,meeting_id:S.lec.m.id,kind:S.kind,body:S.body.trim(),file_path});
    if(error)throw error;
    ls.set('exc.me',{name:S.name.trim(),uid:toEn(S.uid).trim()});S.ref=id.slice(0,6).toUpperCase();
  }catch(e){S.err='تعذّر الإرسال. تأكدي من الاتصال وحاولي مرة أخرى.'}
  finally{S.sending=false;render()}
}
render();loadSections();
</script>
</body></html>
