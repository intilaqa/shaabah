<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17707a">
<title>شعبتي</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one question per card, like a short chat; progress bar on top; big tappable chips */
:root{
  --bg:#f2f5f4;--surface:#fff;--ink:#15262a;--muted:#5b6c70;--line:#dbe3e2;--line-strong:#b8c7c6;
  --accent:#17707a;--accent-ink:#fff;--accent-soft:#dff0ef;--deny:#b42318;--deny-soft:#fcebe9;--ok:#2b7a4b;--ok-soft:#e2f2e7;
  --s1:#fde8c8;--s2:#d3ecea;
  --f-hero:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;--f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517;--surface:#152124;--ink:#e4eeed;--muted:#93a6a8;--line:#243437;--line-strong:#3a4e51;
  --accent:#5fc0c6;--accent-ink:#0a1a1c;--accent-soft:#163338;--deny:#ff8b7e;--deny-soft:#3a1c19;--ok:#6fcf97;--ok-soft:#173022;--s1:#3a2e1f;--s2:#173335;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1517;--surface:#152124;--ink:#e4eeed;--muted:#93a6a8;--line:#243437;--line-strong:#3a4e51;
  --accent:#5fc0c6;--accent-ink:#0a1a1c;--accent-soft:#163338;--deny:#ff8b7e;--deny-soft:#3a1c19;--ok:#6fcf97;--ok-soft:#173022;--s1:#3a2e1f;--s2:#173335;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(160deg,var(--s1),var(--s2) 60%,var(--bg));background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px;min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--f-hero);font-weight:700;font-size:1.05rem;display:flex;gap:8px;align-items:center}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.prog{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;opacity:.9}
.prog i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .35s ease}
.card{background:var(--surface);border-radius:22px;padding:22px 18px;box-shadow:0 18px 40px -26px rgba(21,38,42,.45);display:flex;flex-direction:column;gap:16px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.prog i{transition:none}}
h1{font-family:var(--f-hero);font-size:1.75rem;line-height:1.3;margin:0;text-wrap:balance}
h2{font-family:var(--f-hero);font-size:1.3rem;margin:0;line-height:1.35}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:.82rem;font-weight:600;color:var(--muted)}
.f input,.f textarea{border:1.5px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:12px 14px;width:100%;font-size:1rem}
.f textarea{min-height:130px;resize:vertical}
.chips{display:grid;gap:8px}
.chips.two{grid-template-columns:1fr 1fr}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;text-align:start;display:flex;gap:10px;align-items:center;font-weight:600;min-height:54px}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.chip .e{font-size:1.4rem;line-height:1}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent) inset}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{border:0;border-radius:14px;padding:13px 22px;font-weight:700;font-size:1rem;background:var(--accent);color:var(--accent-ink);min-width:120px}
.btn:disabled{opacity:.45;cursor:default}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:8px}
.att{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line-strong);border-radius:14px;padding:12px;position:relative}
.att input{position:absolute;inset:0;opacity:0;cursor:pointer}
.att .e{font-size:1.5rem}
.att .x{position:relative;z-index:1;background:none;border:0;color:var(--deny);font-weight:700;margin-inline-start:auto}
.review{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.92rem}
.review dt{color:var(--muted)}.review dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.err{background:var(--deny-soft);color:var(--deny);border-radius:12px;padding:10px 12px;font-size:.9rem}
.done{text-align:center;align-items:center}
.done .big{font-size:3.4rem;line-height:1}
.ref{font-family:var(--f-hero);font-size:1.6rem;letter-spacing:.1em;background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:6px 18px;direction:ltr}
.hero{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.plate{background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;min-width:96px;text-align:center;display:flex;flex-direction:column;gap:2px}
.plate small{font-size:.7rem;opacity:.7;font-weight:600}.plate b{font-size:1.5rem;line-height:1.15;direction:ltr;unicode-bidi:isolate;word-break:break-word}
.go{font-family:var(--f-hero);font-size:1.25rem;font-weight:700;line-height:1.35}
.go bdi{direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.ann{background:var(--accent-soft);border-radius:14px;padding:12px 14px;line-height:1.7}
.ann.cx{background:var(--deny-soft);color:var(--deny)}
.ann small{display:block;color:var(--muted);font-size:.78rem}
.wk{display:flex;flex-direction:column;gap:6px}
.wk div{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;background:var(--bg);border-radius:12px;padding:9px 12px;font-size:.92rem}
.wk div.t{outline:2px solid var(--accent)}
.wk b{font-weight:700}.wk .rm{background:var(--ink);color:var(--surface);border-radius:6px;padding:0 7px;font-size:.78rem;font-weight:700;direction:ltr}
.row2{display:flex;gap:8px;flex-wrap:wrap}.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.greet h1{font-size:1.6rem}.greet p{margin:4px 0 0}
.wait{font-size:.95rem;color:var(--accent);font-weight:600;margin-top:2px}
.dh{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.dh .k{font-size:.72rem;font-weight:700;color:var(--accent)}
.dh .t{font-family:"Amiri",serif;font-size:1.35rem;line-height:1.9;margin:0}
.dh .s2{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--muted)}
.dh button{background:none;border:0;color:var(--accent);font-weight:700;font-size:.85rem}
.nm{display:flex;gap:8px;align-items:end}.nm .f{flex:1}
.foot{margin-top:auto;text-align:center;color:var(--muted);font-size:.8rem}
.foot b{font-family:var(--f-hero);color:var(--accent)}
.stabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border-radius:16px;padding:4px;box-shadow:0 10px 30px -24px rgba(21,38,42,.5);position:sticky;top:6px;z-index:5}
.stabs button{border:0;background:none;border-radius:12px;padding:8px 2px;font-weight:700;font-size:.82rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.stabs button span{font-size:1.15rem;line-height:1}
.stabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.stabs .b{position:absolute;top:2px;inset-inline-end:10px;min-width:16px;height:16px;border-radius:8px;background:var(--deny);color:#fff;font-size:.65rem;line-height:16px;padding:0 4px}
.gcard{border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.gcard .gt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gcard .score{font-family:var(--f-hero);font-size:1.7rem;font-weight:700;color:var(--accent);direction:ltr}
.gcard .score small{font-size:.9rem;color:var(--muted)}
.gbar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}.gbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.gitems{display:flex;flex-wrap:wrap;gap:6px}.gitems span{background:var(--bg);border-radius:10px;padding:3px 10px;font-size:.82rem}
.sech{font-family:var(--f-hero);font-size:1.05rem;margin:4px 0 0}
.foot button{background:none;border:0;color:var(--muted);font-size:.78rem;text-decoration:underline;margin-top:4px}
.net{font-size:.75rem;font-weight:600;color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}.net.off i{background:#c98a1a}
.q{background:#fcf0da;color:#7a4a00;border-radius:14px;padding:10px 12px;font-size:.9rem;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.q button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline}
.tch{display:flex;align-items:center;gap:8px;font-family:var(--f-hero);font-size:1.05rem;margin-top:4px}
.tch .av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:1rem}
.chip .tc{font-size:.78rem;color:var(--muted);font-weight:400;display:block}
.spin{width:18px;height:18px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent-ink);display:inline-block;vertical-align:-3px;animation:sp 1s linear infinite;margin-inline-end:6px}
@keyframes sp{to{transform:rotate(360deg)}}
</style></head><body>
<div class="wrap">
  <div class="top"><span class="brand" id="brand"><i></i>شعبتي</span><span><span id="step" class="sub num"></span> <span id="net" class="net"><i></i></span></span></div>
  <div class="prog" aria-hidden="true"><i id="bar" style="width:0"></i></div>
  <main id="view"></main>
  <p class="foot">فكرة وتصميم — <b>نعيمه الرشيدي</b><br><button data-a="iamT">أنا الأستاذة</button><br><span style="font-size:.7rem;opacity:.6">الإصدار ١٢</span></p>
</div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const KINDS=[['🤒','مرضي'],['🖤','وفاة'],['🏠','ظرف عائلي'],['📄','موعد رسمي'],['✏️','أخرى']];
const STEPS=['welcome','who','sec','lec','kind','text','review'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const t12=t=>{if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(m)+' '+ap};
let fD;try{fD=new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{day:'numeric',month:'long'})}catch(e){fD=new Intl.DateTimeFormat('ar',{day:'numeric',month:'long'})}
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toEn=s=>String(s||'').replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const uidOf=s=>{s=toEn(s).trim();if(s.includes('@'))s=s.split('@')[0];return s.replace(/\D/g,'')};
const me=ls.get('exc.me')||{};
const S={mode:'home',mySec:ls.get('exc.sec')||'',myT:ls.get('exc.teacher')||'',queued:0,ann:[],i:0,name:me.name||'',uid:me.uid||'',sec:null,lec:null,kind:'',body:'',file:null,fileName:'',sections:null,err:'',sending:false,ref:''};
const CFG=window.REG_CONFIG||{};
const DOMAIN=String(CFG.studentDomain||'albaha.onmicrosoft.com').toLowerCase();
let sb=null;try{if(CFG.url&&CFG.key&&window.supabase)sb=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'exc.auth'}})}catch(e){}
/* signed-in student: her university ID comes from her university email */
const emailOf=v=>{v=toEn(v).trim().toLowerCase();return v.includes('@')?v:(/^\d{5,12}$/.test(v)?v+'@'+DOMAIN:v)};
S.tab=ls.get('exc.tab')||'home';S.grades=ls.get('exc.grades')||[];S.user=null;S.login={step:'email',email:'',busy:false,err:''};S.mine=ls.get('exc.mine')||[];

/* ---------- my sections: every section (any teacher) whose roster has my university ID ---------- */
const online=()=>navigator.onLine!==false;
const cached=ls.get('exc.cache');
if(cached&&Array.isArray(cached.sections)){S.sections=cached.sections;S.ann=cached.ann||[];S.at=cached.at;if(!S.name&&cached.name)S.name=cached.name}
async function loadSections(){
  if(!sb){if(!S.sections){S.err='الصفحة غير مرتبطة بعد. أخبري أستاذتك.';S.sections=[]}render();return}
  if(!S.user){render();return}
  if(!online()){if(!S.sections){S.err='لا يوجد اتصال. افتحي الصفحة مرة وأنتِ متصلة لتُحفظ على جوالك.';S.sections=[]}render();return}
  try{
    const r=await sb.from('roster').select('section_id,name');if(r.error)throw r.error;
    const ids=[...new Set((r.data||[]).map(x=>x.section_id))];
    const nm=((r.data||[]).find(x=>x.name)||{}).name||'';if(nm&&!S.name)S.name=nm;
    let sections=[],ann=[];
    if(ids.length){
      const q=await sb.from('sections_public').select('*').in('id',ids);if(q.error)throw q.error;sections=q.data||[];
      const owners=[...new Set(sections.map(x=>x.owner).filter(Boolean))];
      const a1=await sb.from('announcements').select('*').in('section_id',ids).order('created_at',{ascending:false}).limit(50);
      const a2=owners.length?await sb.from('announcements').select('*').is('section_id',null).in('owner',owners).order('created_at',{ascending:false}).limit(50):{data:[]};
      ann=[...(a1.data||[]),...(a2.data||[])].sort((x,y)=>x.created_at<y.created_at?1:-1);
    }
    S.sections=sections;S.ann=ann;S.at=Date.now();S.err='';
    ls.set('exc.cache',{sections,ann,at:S.at,name:S.name,uid:S.uid});
  }catch(e){if(!S.sections){S.err='تعذّر تحميل شعبك، حاولي بعد قليل.';S.sections=[]}}
  render();
}

/* ---------- offline: excuses (with photo) wait in the phone, then send themselves ---------- */
const IDB=(()=>{let p;const open=()=>p||(p=new Promise((ok,no)=>{const r=indexedDB.open('exc-outbox',1);r.onupgradeneeded=()=>r.result.createObjectStore('q',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}));
  const tx=(m,f)=>open().then(db=>new Promise((ok,no)=>{const t=db.transaction('q',m),st=t.objectStore('q');const r=f(st);t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)}));
  return{put:v=>tx('readwrite',s=>s.put(v)),del:id=>tx('readwrite',s=>s.delete(id)),all:()=>tx('readonly',s=>s.getAll())}})();
const dupe=e=>e&&(e.code==='23505'||/duplicate|already exists/i.test(e.message||'')||e.statusCode==='409'||e.status===409);
async function upload(x){
  let file_path=null;
  if(x.file){file_path=`${x.row.section_id}/${x.id}.${x.file.type==='application/pdf'?'pdf':'jpg'}`;
    const up=await sb.storage.from('excuse-files').upload(file_path,x.file,{contentType:x.file.type||'image/jpeg',upsert:false});if(up.error&&!dupe(up.error))throw up.error}
  const {error}=await sb.from('excuses').insert({...x.row,id:x.id,file_path});if(error&&!dupe(error))throw error;
}
let flushing=false;
async function flushQ(){
  if(flushing||!sb||!S.user)return;flushing=true;
  try{const list=await IDB.all();S.queued=list.length;
    if(online())for(const x of list){try{await upload(x);await IDB.del(x.id);S.queued--}catch(e){break}}if(online()&&list.length)loadMine()}
  catch(e){}finally{flushing=false;if(S.mode!=='form'||S.ref)render();else netDot()}
}
function netDot(){const n=$('net');if(!n)return;n.className='net'+(online()?'':' off');n.lastChild&&n.lastChild.nodeType===3?n.lastChild.textContent=online()?'':' بدون اتصال':n.append(online()?'':' بدون اتصال')}
window.addEventListener('online',()=>{loadSections();flushQ();loadMine();loadGrades()});
window.addEventListener('offline',()=>{netDot();render()});
setInterval(()=>{if(S.queued&&online())flushQ()},20000);

/* sections grouped by their teacher */
const tName=x=>(x.teacher||'').trim()||'أستاذة المقرر';
const tOf=x=>x.owner||tName(x);
const teachers=()=>[...new Set((S.sections||[]).map(tOf))];
const tLabel=k=>{const x=(S.sections||[]).find(z=>tOf(z)===k);return x?tName(x):''};
function lectures(sec){
  if(!sec)return[];const out=[],today=new Date();today.setHours(0,0,0,0);
  const start=sec.term_start?pd(sec.term_start):new Date(today-60*864e5);
  for(let k=0;k<35;k++){const d=new Date(today);d.setDate(d.getDate()-k);if(d<start)break;
    const ds=ymd(d);for(const m of (sec.meetings||[]).filter(m=>m.day===d.getDay()).sort((a,b)=>a.start<b.start?-1:1)){if((sec.cancelled||[]).some(c=>c.date===ds&&c.meeting_id===m.id))continue;out.push({date:ds,m,k})}}
  return out;
}
function rel(k,d){return k===0?'اليوم':k===1?'أمس':DAYS[d.getDay()]}
function canNext(){const s=STEPS[S.i];
  if(s==='who')return S.name.trim().split(/\s+/).length>=2&&/^\d{5,12}$/.test(uidOf(S.uid));
  if(s==='sec')return !!S.sec;if(s==='lec')return !!S.lec;if(s==='kind')return !!S.kind;if(s==='text')return S.body.trim().length>=2;return true}
const ENC={morning:['ابدئي يومك ببسم الله، والباقي على الله','صباحك همّة ونشاط، وكل محاضرة خطوة لحلمك','توكلي على الله، يومك بإذن الله موفق','قهوتك وقلمك جاهزين؟ يلا نبدأ 💪'],
  noon:['نص اليوم راح، وباقي أجمله','خذي نفس، أنتِ أقرب لهدفك مما تتوقعين','الاستمرار أهم من الكمال، كمّلي'],
  after:['يعطيك العافية على تعب اليوم','ما يضيع تعب، الله يكتب أجرك ويحقق حلمك','راجعي اللي أخذتيه اليوم ولو خمس دقايق'],
  night:['نامي بدري، بكرة يومك أجمل','أغلقي يومك بالحمد والدعاء','تصبحين على خير وراحة بال']};
const DH=[{k:'دعاء',t:'رَبِّ اشْرَحْ لِي صَدْرِي ۝ وَيَسِّرْ لِي أَمْرِي',s:'سورة طه: ٢٥–٢٦'},{k:'آية',t:'وَقُل رَّبِّ زِدْنِي عِلْمًا',s:'سورة طه: ١١٤'},{k:'آية',t:'فَإِنَّ مَعَ الْعُسْرِ يُسْرًا',s:'سورة الشرح: ٥'},
  {k:'دعاء',t:'اللهم لا سهل إلا ما جعلته سهلًا، وأنت تجعل الحَزْن إذا شئت سهلًا',s:''},{k:'آية',t:'وَمَا تَوْفِيقِي إِلَّا بِاللَّهِ',s:'سورة هود: ٨٨'},
  {k:'حديث',t:'من سلك طريقًا يلتمس فيه علمًا، سهّل الله له به طريقًا إلى الجنة',s:'رواه مسلم'},{k:'ذكر',t:'لا حول ولا قوة إلا بالله',s:''},{k:'آية',t:'أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ',s:'سورة الرعد: ٢٨'},
  {k:'دعاء',t:'اللهم إني أسألك علمًا نافعًا، ورزقًا طيبًا، وعملًا متقبلًا',s:''},{k:'ذكر',t:'بسم الله، توكلت على الله',s:''}];

const dur=n=>n<60?`${n} دقيقة`:n<1440?`${Math.floor(n/60)} س${n%60?' و'+(n%60)+' د':''}`:`${Math.round(n/1440)} يوم`;

function nextLecture(sec){const now=new Date(),nowM=now.getHours()*60+now.getMinutes();
  for(let k=0;k<14;k++){const d=new Date(now);d.setDate(d.getDate()+k);const ds=ymd(d);
    const L=(sec.meetings||[]).filter(m=>m.day===d.getDay()).sort((a,b)=>a.start<b.start?-1:1);
    for(const m of L){const end=mins(m.end)||mins(m.start)+Math.round((m.hours||1)*50);if(k===0&&end<=nowM)continue;
      const cx=(sec.cancelled||[]).find(c=>c.date===ds&&c.meeting_id===m.id);
      return{d,ds,m,k,cx,now:k===0&&mins(m.start)<=nowM,inMin:k===0?mins(m.start)-nowM:null}}}return null}

async function loadMine(){
  if(!sb||!S.user||!online())return;
  const {data,error}=await sb.from('excuses').select('id,section_id,lecture_date,meeting_id,kind,status,reason,created_at').order('created_at',{ascending:false}).limit(30);
  if(!error){S.mine=data||[];ls.set('exc.mine',S.mine);if(S.mode!=='form')render()}
}
async function loadGrades(){
  if(!sb||!S.user||!online())return;

}

}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;S[k]=e.target.value;const b=document.querySelector('[data-a=next],[data-a=send]');if(b)b.disabled=!canNext()});
document.addEventListener('change',async e=>{if(e.target.id!=='fl')return;const f=e.target.files[0];if(!f)return;
  try{if(f.type==='application/pdf'){if(f.size>3*1024*1024){alertErr('الملف أكبر من ٣ ميجا');return}S.file=f;S.fileName=f.name}
    else{S.file=await shrink(f);S.fileName=f.name.replace(/\.\w+$/,'')+'.jpg'}}catch(_){alertErr('تعذّرت قراءة الصورة، جرّبي صورة أخرى')}
  render()});
function alertErr(t){S.err=t;render();setTimeout(()=>{S.err='';},4000)}
function shrink(file){return new Promise((ok,no)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const M=1600,r=Math.min(1,M/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',.72)};img.onerror=no;img.src=u})}
document.addEventListener('click',async e=>{const t=e.target.closest('[data-a]');if(!t)return;const a=t.dataset.a;
  if(a==='dh'){dhi++;render();return}
  if(a==='stab'){S.tab=t.dataset.v;ls.set('exc.tab',S.tab);render();window.scrollTo(0,0);if(S.tab==='grades')loadGrades();if(S.tab==='exc')loadMine();return}
  if(a==='lSend'){const em=emailOf(($('le')||{}).value||'');S.login.email=em;
    if(!em.endsWith('@'+DOMAIN)){S.login.err='اكتبي إيميلك الجامعي المنتهي بـ @'+DOMAIN;render();return}
    if(!online()){S.login.err='لا يوجد اتصال بالإنترنت.';render();return}
    S.login.busy=true;S.login.err='';render();
    const {error}=await sb.auth.signInWithOtp({email:em,options:{shouldCreateUser:true}});
    S.login.busy=false;if(error){const m=String(error.message||'');S.login.err=/rate|seconds/i.test(m)?'انتظري دقيقة ثم أعيدي المحاولة.'
      :/sending|smtp|email/i.test(m)?'تعذّر إرسال الإيميل من الخادم (إعداد البريد في Supabase). أخبري أستاذتك.'
      :/signup|sign up|not allowed/i.test(m)?'التسجيل غير مفعّل حاليًا. أخبري أستاذتك.':'تعذّر إرسال الرمز. حاولي مجددًا.';S.login.detail=m+(error.status?' ('+error.status+')':'')}else{S.login.step='code';S.login.detail=''}render();return}
  if(a==='lBack'){S.login.step='email';S.login.err='';render();return}
  if(a==='lVerify'){const code=toEn(($('lc')||{}).value||'').replace(/\D/g,'');if(code.length<6){S.login.err='اكتبي الرمز كاملًا';render();return}
    S.login.busy=true;S.login.err='';render();
    const {data,error}=await sb.auth.verifyOtp({email:S.login.email,token:code,type:'email'});
    S.login.busy=false;if(error||!data||!data.session){S.login.err='الرمز غير صحيح أو انتهت صلاحيته.';render();return}
    setUser(data.session.user);return}
  if(a==='lOut'){await sb.auth.signOut();S.user=null;S.mine=[];ls.set('exc.mine',[]);ls.set('exc.cache',null);ls.set('exc.grades',[]);S.grades=[];S.sections=null;S.ann=[];S.name='';S.login={step:'email',email:'',busy:false,err:''};render();return}
  if(a==='iamT'){try{localStorage.setItem('reg.role','t')}catch(_){}location.href='index.html?role=t';return}
  if(a==='myT'){S.myT=t.dataset.v;ls.set('exc.teacher',S.myT);render();return}
  if(a==='flush'){flushQ();return}
  if(a==='mysec'){S.mySec=t.dataset.v;ls.set('exc.sec',S.mySec);const sx=S.sections.find(x=>x.id===S.mySec);if(sx){S.myT=tOf(sx);ls.set('exc.teacher',S.myT)}if(S.name.trim())ls.set('exc.me',{...(ls.get('exc.me')||{}),name:S.name.trim()});S.mode='home';render();return}
  if(a==='pick'){S.mode='pick';render();return}
  if(a==='home'){S.mode='home';S.ref='';S.saved=false;S.i=0;S.err='';render();window.scrollTo(0,0);return}
  if(a==='reload'){S.sections=null;render();loadSections();return}
  if(a==='excuse'){S.mode='form';S.i=S.name.trim().split(/\s+/).length>=2?2:1;S.sec=S.sections.length===1?S.sections[0]:null;if(STEPS[S.i]==='sec'&&S.sec)S.i++;S.lec=null;S.kind='';S.body='';S.file=null;S.fileName='';S.ref='';render();window.scrollTo(0,0);return}
  if(a==='next'&&canNext()){S.err='';S.i++;if(STEPS[S.i]==='sec'&&S.sec)S.i++;render();window.scrollTo(0,0)}
  else if(a==='back'){const lo=S.name.trim().split(/\s+/).length>=2?2:1;S.i=S.i-1;if(STEPS[S.i]==='sec'&&S.sections.length===1)S.i--;if(S.i<lo){S.mode='home';S.i=0}S.err='';render();window.scrollTo(0,0)}
  else if(a==='sec'){S.sec=S.sections.find(x=>x.id===t.dataset.v);S.lec=null;render()}
  else if(a==='lec'){const[date,mid]=t.dataset.v.split('|');S.lec={key:t.dataset.v,date,m:S.sec.meetings.find(m=>m.id===mid)};render()}
  else if(a==='kind'){S.kind=t.dataset.v;render()}
  else if(a==='rmfile'){S.file=null;S.fileName='';render()}
  else if(a==='again'){Object.assign(S,{mode:'form',i:S.name.trim().split(/\s+/).length>=2?2:1,saved:false,sec:S.sections.length===1?S.sections[0]:null,lec:null,kind:'',body:'',file:null,fileName:'',ref:'',err:''});render()}
  else if(a==='send')send();
});
async function send(){
  if(S.sending)return;if(!sb){alertErr('الصفحة غير مرتبطة بعد.');return}
  if(!S.user){S.mode='home';render();return}
  S.sending=true;S.err='';render();
  const id=(crypto.randomUUID?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-8xxx-xxxxxxxxxxxx'.replace(/x/g,()=>(Math.random()*16|0).toString(16)));
  const x={id,file:S.file||null,row:{student_name:S.name.trim().replace(/\s+/g,' '),student_uid:uidOf(S.uid),section_id:S.sec.id,lecture_date:S.lec.date,meeting_id:S.lec.m.id,kind:S.kind,body:S.body.trim()}};
  ls.set('exc.me',{name:S.name.trim(),uid:uidOf(S.uid)});
  let sent=false;
  if(online()){try{await upload(x);sent=true}catch(e){}}
  if(!sent){try{await IDB.put({...x,at:Date.now()});S.queued++;S.saved=true}catch(e){S.sending=false;alertErr('تعذّر الإرسال والحفظ. حاولي مرة أخرى.');return}}
  S.ref=id.slice(0,6).toUpperCase();S.sending=false;render();if(sent)loadMine();
}
function setUser(u){S.user=u||null;if(u){S.uid=uidOf(u.email);const c=ls.get('exc.cache');if(c&&c.uid&&c.uid!==S.uid){S.sections=null;S.ann=[];S.name=''}const m=ls.get('exc.me')||{};ls.set('exc.me',{...m,uid:S.uid})}render();if(u){loadSections();flushQ();loadMine();loadGrades()}}
(async()=>{if(sb){try{const {data}=await sb.auth.getSession();S.user=data&&data.session&&data.session.user||null;if(S.user)S.uid=uidOf(S.user.email)}catch(e){}
  {const c=ls.get('exc.cache');if(!S.user||(c&&c.uid&&c.uid!==S.uid)){S.sections=S.user?null:S.sections;if(!S.user){S.sections=null;S.ann=[]}}}
  sb.auth.onAuthStateChange((_e,ses)=>{const u=ses&&ses.user||null;if((u&&u.id)!==(S.user&&S.user.id))setUser(u)})}
  render();netDot();loadSections();flushQ();loadMine();loadGrades()})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
