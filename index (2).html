<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17707a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="سجل الحضور">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>سجل الحضور</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: a calm daily companion. Home = sky-tinted hero that follows the time of day, a door-sign plaque for the next room, then today's timeline. Other tabs are quiet working sheets. */
:root{
  --bg:#f2f5f4; --surface:#ffffff; --ink:#15262a; --muted:#5b6c70; --line:#dbe3e2; --line-strong:#b8c7c6;
  --accent:#17707a; --accent-ink:#ffffff; --accent-soft:#dff0ef;
  --plate:#15262a; --plate-ink:#f4f8f7; --plate-sub:#9fb4b3;
  --deny:#b42318; --deny-soft:#fcebe9; --warn:#9a5800; --warn-soft:#fcf0da; --warn2:#c2410c; --warn2-soft:#fde7dc;
  --cut:#6b3fa0; --cut-soft:#f0e9f9; --ok:#2b7a4b; --ok-soft:#e2f2e7;
  --k1:#d8edee; --k2:#f4e5cf; --k3:#e3ead1; --k4:#ebdff0; --k5:#f4dcdc; --k6:#dbe2f4;
  --sky-morning-1:#fde8c8; --sky-morning-2:#d3ecea;
  --sky-noon-1:#d6efee; --sky-noon-2:#cfe1f3;
  --sky-after-1:#f6dcc7; --sky-after-2:#e3d9ef;
  --sky-night-1:#d9dcef; --sky-night-2:#cfe0e6;
  --f-hero:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1517; --surface:#152124; --ink:#e4eeed; --muted:#93a6a8; --line:#243437; --line-strong:#3a4e51;
  --accent:#5fc0c6; --accent-ink:#0a1a1c; --accent-soft:#163338;
  --plate:#e9f2f1; --plate-ink:#10201f; --plate-sub:#4f6567;
  --deny:#ff8b7e; --deny-soft:#3a1c19; --warn:#f0b65e; --warn-soft:#33281a; --warn2:#ff9f6e; --warn2-soft:#3a2418;
  --cut:#c4a3f1; --cut-soft:#2a2238; --ok:#6fcf97; --ok-soft:#173022;
  --k1:#1b3a3d; --k2:#3a2f1f; --k3:#2c3420; --k4:#33263a; --k5:#3a2224; --k6:#232a40;
  --sky-morning-1:#3a2e1f; --sky-morning-2:#173335;
  --sky-noon-1:#163538; --sky-noon-2:#1a2b3d;
  --sky-after-1:#3a2a20; --sky-after-2:#2a2338;
  --sky-night-1:#1c2038; --sky-night-2:#14272b;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1517; --surface:#152124; --ink:#e4eeed; --muted:#93a6a8; --line:#243437; --line-strong:#3a4e51;
  --accent:#5fc0c6; --accent-ink:#0a1a1c; --accent-soft:#163338;
  --plate:#e9f2f1; --plate-ink:#10201f; --plate-sub:#4f6567;
  --deny:#ff8b7e; --deny-soft:#3a1c19; --warn:#f0b65e; --warn-soft:#33281a; --warn2:#ff9f6e; --warn2-soft:#3a2418;
  --cut:#c4a3f1; --cut-soft:#2a2238; --ok:#6fcf97; --ok-soft:#173022;
  --k1:#1b3a3d; --k2:#3a2f1f; --k3:#2c3420; --k4:#33263a; --k5:#3a2224; --k6:#232a40;
  --sky-morning-1:#3a2e1f; --sky-morning-2:#173335;
  --sky-noon-1:#163538; --sky-noon-2:#1a2b3d;
  --sky-after-1:#3a2a20; --sky-after-2:#2a2338;
  --sky-night-1:#1c2038; --sky-night-2:#14272b;
  color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px 4px;flex-wrap:wrap}
.brand{font-family:var(--f-hero);font-size:1.12rem;font-weight:700;margin:0;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
.sum{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;white-space:nowrap;border:0}
.pill.deny{background:var(--deny-soft);color:var(--deny)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.warn2{background:var(--warn2-soft);color:var(--warn2)}
.pill.cut{background:var(--cut-soft);color:var(--cut)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.muted{background:var(--bg);color:var(--muted)}
.pill.new{background:var(--ink);color:var(--surface)}
.net{font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.net i{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off i{background:var(--warn)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr)}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 0 9px;font-weight:600;color:var(--muted);font-size:.78rem;position:relative;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .dot{position:absolute;top:3px;inset-inline-end:2px;min-width:17px;height:17px;border-radius:9px;background:var(--deny);color:var(--surface);font-size:.68rem;line-height:17px;padding:0 4px}

.credit{display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:4px 120px;text-align:center}
.credit .cr-line{width:42px;height:3px;border-radius:2px;background:var(--accent);opacity:.6}
.credit p{margin:0;font-size:.82rem;color:var(--muted)}
.credit b{font-family:var(--f-hero);font-weight:700;color:var(--accent);font-size:.95rem}
main{padding-block:16px 28px;display:flex;flex-direction:column;gap:20px}
h2{font-family:var(--f-hero);font-size:1.08rem;font-weight:600;margin:0}
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.83rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.banner{border-radius:var(--r);padding:10px 14px;font-size:.86rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:12px}
.banner.info{background:var(--accent-soft);color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
.banner.err{background:var(--deny-soft);color:var(--deny)}

.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:.86rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--deny);border-color:var(--deny)}
.btn.danger.armed{background:var(--deny);color:var(--surface)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.lg{padding:10px 18px;font-size:.95rem}
.btn:disabled{opacity:.5;cursor:default}
.lnk{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:.84rem}
.lnk.red{color:var(--deny)}
.lnk.mut{color:var(--muted)}

/* ---------- home ---------- */
.hero{border-radius:22px;padding:20px 18px 18px;display:flex;flex-direction:column;gap:16px;background:linear-gradient(150deg,var(--s1),var(--s2));position:relative;overflow:hidden}
.hero[data-tod="morning"]{--s1:var(--sky-morning-1);--s2:var(--sky-morning-2)}
.hero[data-tod="noon"]{--s1:var(--sky-noon-1);--s2:var(--sky-noon-2)}
.hero[data-tod="after"]{--s1:var(--sky-after-1);--s2:var(--sky-after-2)}
.hero[data-tod="night"]{--s1:var(--sky-night-1);--s2:var(--sky-night-2)}
.hero::after{content:"";position:absolute;inset-block-start:-60px;inset-inline-end:-60px;width:200px;height:200px;border-radius:50%;border:28px solid var(--surface);opacity:.35;pointer-events:none}
.greet{position:relative;z-index:1}
.greet h2{font-size:clamp(1.5rem,6vw,2rem);font-weight:700;line-height:1.25;text-wrap:balance}
.greet p{margin:6px 0 0;font-size:.95rem;color:var(--ink);opacity:.85;max-width:44ch}
.greet .when{font-size:.8rem;color:var(--muted);margin-top:8px;opacity:1}
.next{position:relative;z-index:1;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border-radius:16px;padding:12px;box-shadow:0 6px 20px -12px rgba(0,0,0,.35)}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:12px;padding:10px 14px;min-width:96px;text-align:center;display:flex;flex-direction:column;gap:2px}
.plate small{font-size:.7rem;color:var(--plate-sub);letter-spacing:.04em;font-weight:600}
.plate b{direction:ltr;unicode-bidi:isolate;font-size:1.6rem;line-height:1.15;font-weight:700;font-variant-numeric:tabular-nums;word-break:break-word}
.next .go{font-family:var(--f-hero);font-size:1.15rem;font-weight:700;line-height:1.35}
.next .go .rm{white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.next .what{font-size:.86rem;color:var(--muted)}
.next .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.next.rest{grid-template-columns:1fr}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:start}
.stat b{display:block;font-size:1.35rem;font-weight:700;line-height:1.2}
.stat span{font-size:.76rem;color:var(--muted)}
button.stat{cursor:pointer}
.stat.alert b{color:var(--deny)}
.dhikr{position:relative;overflow:hidden;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.dhikr::before{content:"";position:absolute;inset-block-start:0;inset-inline:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
.dhikr .kind{font-size:.72rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.dhikr .txt{font-family:"Amiri","Reem Kufi",serif;font-size:clamp(1.25rem,5vw,1.55rem);line-height:1.9;margin:0;text-wrap:balance;color:var(--ink)}
.dhikr .src{font-size:.78rem;color:var(--muted)}
.dhikr .row2{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dhikr .cnt{display:inline-flex;align-items:center;gap:8px}
.tap{border:1px solid var(--line-strong);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.84rem;font-variant-numeric:tabular-nums}
.tap:active{transform:scale(.96)}
.dhikr .fade{animation:fd .45s ease}
@keyframes fd{from{opacity:.2;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dhikr .fade{animation:none}}

.tl{display:flex;flex-direction:column;position:relative;padding-inline-start:18px}
.tl::before{content:"";position:absolute;inset-block:10px;inset-inline-start:5px;width:2px;background:var(--line)}
.ti{position:relative;display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px;text-align:start;width:100%}
.ti::before{content:"";position:absolute;inset-inline-start:-18px;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.ti.done::before{background:var(--ok);border-color:var(--ok)}
.ti.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ti.now::before{background:var(--accent);border-color:var(--accent)}
.ti.past{opacity:.78}
.ti.cancel{opacity:.6}
.ti.cancel .nm{text-decoration:line-through;text-decoration-color:var(--muted)}
.ti .t{font-size:.8rem;color:var(--muted);line-height:1.35}
.ti .t b{display:block;color:var(--ink);font-size:1rem;font-weight:600}
.ti .nm{font-weight:600;min-width:0;line-height:1.4}
.ti .sub{display:block;color:var(--muted);font-size:.78rem;font-weight:400}
.room{display:inline-block;background:var(--plate);color:var(--plate-ink);border-radius:6px;padding:0 7px;font-size:.74rem;font-weight:700;margin-inline-end:4px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-hero);font-size:1rem;margin-bottom:4px}

.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.week{grid-template-columns:1fr}}
.day{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.day.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.day h3{font-size:.8rem;margin:0;color:var(--muted);font-weight:700}
.day.today h3{color:var(--accent)}
.mt{border-radius:8px;padding:6px 8px;font-size:.78rem;line-height:1.45;color:var(--ink)}
.mt b{display:block;font-weight:600}
.day .none{font-size:.76rem;color:var(--muted)}

/* ---------- forms / take ---------- */
.pickers{display:grid;grid-template-columns:2fr 1.3fr;gap:8px}
@media (max-width:520px){.pickers{grid-template-columns:1fr 1fr}.pickers .f:first-child{grid-column:1/-1}}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label,.lbl{font-size:.75rem;color:var(--muted);font-weight:600;letter-spacing:.01em}
.f input,.f select,.f textarea{border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:8px 10px;width:100%;min-width:0}
.f textarea{min-height:96px;resize:vertical}
.f input[type=date],.f input[type=time]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:40px;text-align:start}
main,.card,.sec{min-width:0;max-width:100%}
main{overflow-x:clip}
.state{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
.reasons{display:flex;gap:6px;flex-wrap:wrap}
.cancelled{background:var(--bg);border:1px dashed var(--line-strong);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.cancelled b{font-family:var(--f-hero);font-size:1.05rem}
.roll{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .i{color:var(--muted);font-size:.78rem;text-align:center}
.row .who{min-width:0;font-weight:500;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.row .who small{color:var(--muted);font-size:.74rem;font-weight:400;width:100%}
.seg{display:inline-grid;grid-template-columns:repeat(4,38px);border:1px solid var(--line-strong);border-radius:9px;overflow:hidden}
.seg button{border:0;border-inline-start:1px solid var(--line);background:var(--surface);height:38px;font-weight:700;color:var(--muted)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed="true"][data-m="p"]{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"][data-m="a"]{background:var(--deny);color:var(--surface)}
.seg button[aria-pressed="true"][data-m="l"]{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"][data-m="e"]{background:var(--accent-soft);color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend b{color:var(--ink)}
.savebar{position:fixed;inset:auto 0 0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px}
.savebar .in{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tally{display:flex;gap:10px;font-size:.82rem;color:var(--muted)}
.tally b{color:var(--ink)}

/* ---------- charts ---------- */
.chart{padding:14px;display:flex;flex-direction:column;gap:10px}
.chart h3{margin:0;font-size:.9rem;font-weight:700}
.cols-wrap{overflow-x:auto;padding-bottom:2px}
.cols{position:relative;display:flex;align-items:flex-end;gap:2px;height:150px;margin-top:10px;padding-inline-start:34px}
.cols .ax{position:absolute;inset-inline:34px 0;border-top:1px solid var(--line);font-size:.66rem;color:var(--muted)}
.cols .ax span{position:absolute;inset-inline-start:-34px;top:-.7em;width:30px;text-align:end}
.cols .ax.ref{border-top:1.5px dashed var(--deny);z-index:1}
.cols .ax.ref span{color:var(--deny);font-weight:700}
.col{flex:1 1 0;min-width:3px;max-width:34px;background:var(--accent);border-radius:4px 4px 0 0;position:relative;z-index:2;min-height:2px}
.col.low{background:var(--warn)}
.col.x{background:repeating-linear-gradient(45deg,var(--line-strong) 0 3px,transparent 3px 6px);height:100%!important;opacity:.55;border-radius:4px}
.col.sel{outline:2px solid var(--ink);outline-offset:1px}
.xl{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted);padding-inline-start:34px}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(80px,30%) 1fr 48px;gap:8px;align-items:center;font-size:.8rem;background:none;border:0;padding:0;text-align:start;width:100%}
.hb .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.hb .tr{position:relative;height:14px;background:var(--bg);border-radius:7px;border:1px solid var(--line)}
.hb .tr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:7px;background:var(--accent)}
.hb .tr i.low{background:var(--warn)} .hb .tr i.bad{background:var(--deny)}
.hb .tr s{position:absolute;inset-block:-3px;width:2px;background:var(--deny);text-decoration:none}
.hb .v{font-weight:700;text-align:end}
.hb.on .n{color:var(--accent);font-weight:700}
.clegend{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted)}
.clegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:4px;vertical-align:-1px}

/* ---------- register ---------- */
.regwrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.reg{border-collapse:separate;border-spacing:0;font-size:.8rem;min-width:100%}
.reg th,.reg td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:center;white-space:nowrap;background:var(--surface)}
.reg thead th{position:sticky;top:0;z-index:2;background:var(--bg);font-weight:600;color:var(--muted);font-size:.72rem;line-height:1.3}
.reg thead th button{border:0;background:none;color:inherit;font:inherit;padding:0;cursor:pointer}
.reg thead th.xc{text-decoration:line-through}
.reg .nm{position:sticky;inset-inline-start:0;z-index:1;text-align:start;min-width:150px;max-width:190px;white-space:normal;font-weight:500;border-inline-end:1px solid var(--line)}
.reg thead .nm{z-index:3}
.reg .tot{font-weight:600;color:var(--ink);background:var(--bg)}
.reg td.m{font-weight:700;width:30px}
.reg td.m-a{color:var(--surface);background:var(--deny)}

<script>
/* ---------- who is opening: student or teacher ---------- */
(function(){
  const get=()=>{try{return localStorage.getItem('reg.role')}catch(e){return null}},put=v=>{try{v?localStorage.setItem('reg.role',v):localStorage.removeItem('reg.role')}catch(e){}};
  const q=new URLSearchParams(location.search).get('role');if(q==='t'||q==='s')put(q);
  const r=get();if(r==='s'){location.replace('excuse.html');return}
  const box=document.getElementById('role');if(!r)box.hidden=false;
  document.addEventListener('click',e=>{
    const b=e.target.closest('[data-role]');
    if(b){e.stopPropagation();put(b.dataset.role);if(b.dataset.role==='s')location.href='excuse.html';else{box.hidden=true;window.scrollTo(0,0)}return}
    if(e.target.closest('[data-role-switch]')){put(null);box.hidden=false}
  },true);
})();
const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
const DEF={minAttend:75,warn1:10,warn2:20,cutWeeks:4,lateEq:0,countExcused:true,sample:false,terms:[],currentTerm:'',profile:{name:'',title:'أستاذة'}};
const MK={p:{t:'ح',l:'حاضرة'},a:{t:'غ',l:'غائبة'},l:{t:'ت',l:'متأخرة'},e:{t:'ع',l:'غائبة بعذر'}};
const LV={3:{t:'حرمان',c:'deny'},2:{t:'إنذار ثانٍ',c:'warn2'},1:{t:'إنذار أول',c:'warn'}};
const REASONS=['اجتماع','إجازة رسمية','عذر طارئ','نشاط جامعي','أخرى'];
const LS={cache:'reg.cache.v2',out:'reg.outbox.v2',seen:'reg.seen.v2'};
const HOURS=[0.5,1,1.5,2,2.5,3,3.5,4];
const coll=new Intl.Collator('ar',{sensitivity:'base',numeric:true});
let db=null,sampleFn=null,sampleImg=null,dl=null;
const S={classes:[],att:[],settings:{...DEF},got:{c:0,a:0,s:0},tab:'home',sheet:null,filter:'all',secFilter:'',regSec:'',
  canWrite:true,status:'loading',live:false,armed:null,copyFor:null,openCls:null,outbox:{},seen:{},flushing:false,wq:Promise.resolve(),needRender:false,
  parsed:{},imp:null,rosterBusy:null,cancelUI:false};

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const F=o=>{try{return new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',o)}catch(e){return new Intl.DateTimeFormat('ar',o)}};
const fG=F({weekday:'long',day:'numeric',month:'long',year:'numeric'}),fS=F({day:'numeric',month:'short'}),fW=F({weekday:'long',day:'numeric',month:'long'});
let fH=null;try{fH=new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn',{day:'numeric',month:'long',year:'numeric'})}catch(e){}
const r2=n=>Math.round(n*100)/100;
const nf=n=>String(r2(n));
const hrs=n=>{n=r2(n);return n===1?'ساعة':n===2?'ساعتان':nf(n)+' ساعات'};
const t12=t=>{if(!t)return '';let[h,m]=t.split(':').map(Number);const ap=h<12?'ص':'م';h=h%12||12;return h+':'+pad(m)+' '+ap};
const mins=t=>{if(!t)return null;const[h,m]=t.split(':').map(Number);return h*60+(m||0)};
const suggestH=(s,e)=>{const a=mins(s),b=mins(e);if(a==null||b==null||b<=a)return null;return Math.max(.5,Math.round((b-a)/55*2)/2)};
const endOf=m=>m.end||(m.start&&m.hours?(()=>{const x=mins(m.start)+Math.round(m.hours*50);return pad(Math.floor(x/60))+':'+pad(x%60)})():'');
const rid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const key=(c,d,m)=>c+'_'+d+'_'+m;
const $=id=>document.getElementById(id);
const lsGet=k=>{try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const fem=()=>/ة$/.test((S.settings.profile||{}).title||'أستاذة');
const g=(f,m)=>fem()?f:m;
const dm=s=>{const p=pd(s);return p.getDate()+'/'+(p.getMonth()+1)};

/* ---------- term / data access ---------- */
const term=()=>S.settings.terms.find(t=>t.id===S.settings.currentTerm)||S.settings.terms[0]||null;
const secs=()=>{const t=term();return S.classes.filter(c=>t&&c.term===t.id).sort((a,b)=>(a.order||0)-(b.order||0))};
const cById=id=>S.classes.find(c=>c.id===id);
const cIdx=id=>Math.max(0,secs().findIndex(c=>c.id===id))%6+1;
const sorted=c=>[...(c.students||[])].sort((a,b)=>coll.compare(a.name,b.name));
function allAtt(){const m=new Map(S.att.map(d=>[d.id,d]));for(const[id,b]of Object.entries(S.outbox)){if(b===null)m.delete(id);else m.set(id,{id,...b})}return[...m.values()]}
function sunday(d){const x=new Date(d);x.setDate(x.getDate()-x.getDay());x.setHours(0,0,0,0);return x}
function weekNo(dateStr){const t=term();if(!t||!t.start)return null;return Math.round((sunday(pd(dateStr))-sunday(pd(t.start)))/864e5/7)+1}
const meetLabel=m=>`${DAYS[m.day]} ${t12(m.start)}${m.room?' · قاعة '+m.room:''} · ${hrs(m.hours)}`;
const sessOf=cid=>allAtt().filter(d=>d.classId===cid).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:((x.start||'')<(y.start||'')?-1:1));

/* ---------- calculation ---------- */
/* Hours-based. A cancelled lecture counts for nobody and is taken off the course's planned total. */
function computeStats(){
  const st=S.settings,t=term(),out=[],A=allAtt();
  for(const c of secs()){
    const meets=c.meetings||[];
    const sessAll=A.filter(d=>d.classId===c.id).sort((x,y)=>x.date<y.date?-1:x.date>y.date?1:((x.start||'')<(y.start||'')?-1:1));
    const sess=sessAll.filter(d=>!d.cancelled);
    const cancH=sessAll.filter(d=>d.cancelled).reduce((s,d)=>s+(+d.hours||0),0);
    const weeklyH=meets.reduce((s,m)=>s+(+m.hours||0),0);
    const heldH=sess.reduce((s,d)=>s+(+d.hours||0),0);
    const planned=(t&&t.weeks>0&&weeklyH>0)?Math.max(0,weeklyH*t.weeks-cancH):heldH;
    const maxAbs=planned*(100-st.minAttend)/100;
    const w1=planned*st.warn1/100,w2=planned*st.warn2/100;
    const lastDate=sess.length?sess[sess.length-1].date:null;
    for(const s of sorted(c)){
      let aH=0,eH=0,lH=0,aN=0,eN=0,lN=0,runStart=null;const abs=[];
      for(const d of sess){const m=(d.marks||{})[s.id];if(!m)continue;const h=+d.hours||0;
        if(m==='a'){aH+=h;aN++;abs.push(d.date);if(!runStart)runStart=d.date}
        else if(m==='e'){eH+=h;eN++;abs.push(d.date);if(!runStart)runStart=d.date}
        else{if(m==='l'){lN++;if(st.lateEq>0&&lN%st.lateEq===0)lH+=h}runStart=null}}
      const absH=r2(aH+(st.countExcused?eH:0)+lH);
      let level=0;
      if(planned>0){if(absH>maxAbs+1e-9)level=3;else if(st.warn2>0&&absH>=w2-1e-9)level=2;else if(st.warn1>0&&absH>=w1-1e-9)level=1}
      const runWeeks=runStart&&lastDate&&weekNo(runStart)!=null?weekNo(lastDate)-weekNo(runStart)+1:0;
      const cut=st.cutWeeks>0&&runWeeks>=st.cutWeeks;
      out.push({c,s,aH,eH,lH,aN,eN,lN,absH,planned,maxAbs,level,runWeeks,runStart,cut,abs,heldH,cancH,
        attPct:planned?r2((1-absH/planned)*100):100,left:r2(maxAbs-absH)});
    }
  }
  return out;
}
const sig=x=>x.level+'|'+(x.cut?1:0);
const skey=x=>x.c.id+'|'+x.s.id;
const isAlert=x=>x.level||x.cut||(S.settings.cutWeeks>1&&x.runWeeks>=S.settings.cutWeeks-1);
const isNew=x=>(x.level||x.cut)&&S.seen[skey(x)]!==sig(x);
const statusTxt=x=>x.level===3?'حرمان':x.cut?'انقطاع':x.level?LV[x.level].t:'منتظمة';
/* attendance rate of one held lecture: present + late over students marked */
const lectureRate=d=>{const v=Object.values(d.marks||{});return v.length?v.filter(m=>m==='p'||m==='l').length/v.length:null};
/* section rate so far: attended hours over held hours × students */
function sectionRate(c){const sess=sessOf(c.id).filter(d=>!d.cancelled);let tot=0,att=0;
  for(const d of sess){const h=+d.hours||0;for(const m of Object.values(d.marks||{})){tot+=h;if(m==='p'||m==='l')att+=h}}return tot?att/tot:null}

/* ---------- writing + offline outbox ---------- */
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),ms||2400)}
function write(fn,okMsg){
  if(!db||!S.live){toast('هذا التعديل يحتاج اتصالًا بالإنترنت. التحضير وحده يُحفظ بدون اتصال.',3500);return Promise.resolve()}
  S.wq=S.wq.then(fn).then(()=>{okMsg&&toast(okMsg)}).catch(e=>{
    if(e&&e.code==='invalid_argument'){S.canWrite=false;toast('لا توجد صلاحية تعديل على هذا السجل')}
    else if(e&&e.code==='quota_exceeded')toast('امتلأت مساحة السجل');
    else toast('تعذّر الحفظ، تحقق من الاتصال وحاول مجددًا');render()});return S.wq}
function queue(id,body){S.outbox[id]=body;lsSet(LS.out,S.outbox);flush()}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r({code:'timeout'}),ms))]);
async function flush(){
  if(S.flushing||!db)return;S.flushing=true;
  try{for(const id of Object.keys(S.outbox)){
      if(navigator.onLine===false)break;
      const b=S.outbox[id];
      try{await withTimeout(b===null?db.doc('attendance/'+id).delete():db.doc('attendance/'+id).set(b),15000);
        if(S.outbox[id]===b){delete S.outbox[id];lsSet(LS.out,S.outbox)}}
      catch(e){if(e&&e.code==='invalid_argument'){delete S.outbox[id];lsSet(LS.out,S.outbox);S.canWrite=false}break}}}
  finally{S.flushing=false;renderHead(computeStats())}
}
window.addEventListener('online',()=>{flush();render()});
window.addEventListener('offline',()=>render());
setInterval(()=>{if(Object.keys(S.outbox).length)flush()},20000);
setInterval(()=>{if(S.tab==='home')render()},60000);
let cacheT;function saveCache(){clearTimeout(cacheT);cacheT=setTimeout(()=>lsSet(LS.cache,{classes:S.classes,att:S.att,settings:S.settings,at:Date.now()}),800)}

/* ---------- header ---------- */
function renderHead(stats){
  const d=stats.filter(x=>x.level===3).length,c=stats.filter(x=>x.cut).length;
  const pend=Object.keys(S.outbox).length,off=navigator.onLine===false;
  $('sum').innerHTML=(S.status==='loading'?'':(d?`<span class="pill deny num">${d} حرمان</span>`:'')+(c?`<span class="pill cut num">${c} انقطاع</span>`:''))+
    `<span class="net ${off||pend?'off':''}"><i></i>${pend?'جارٍ الحفظ':'محفوظ على الجهاز'}</span>`;
  const nw=stats.filter(isNew).length;
  document.querySelectorAll('.tabs button').forEach(b=>{b.setAttribute('aria-selected',b.dataset.tab===S.tab);b.querySelector('.dot')?.remove();
    if(b.dataset.tab==='alerts'&&nw>0&&S.tab!=='alerts'){const s=document.createElement('span');s.className='dot num';s.textContent=nw;b.appendChild(s)}});

/* ---------- charts ---------- */
function chartSections(){

function chartLectures(c){

    const r=lectureRate(d),p=r==null?0:Math.round(r*100);return `<span class="col ${p<min?'low':''}" style="height:${Math.max(p,1)}%" title="${esc(dm(d.date))} · حضور ${p}%"></span>`}).join('');

/* ---------- register sheet ---------- */
function vReg(stats){
  const L=secs();
  if(!L.length)return '<div class="card empty"><b>لا توجد شعب بعد</b>ارفع جدولك من «الإعداد».</div>';
  if(!S.regSec||!L.find(c=>c.id===S.regSec))S.regSec=L[0].id;
  const c=cById(S.regSec),sess=sessOf(c.id),studs=sorted(c),stMap=new Map(stats.filter(x=>x.c.id===c.id).map(x=>[x.s.id,x]));
  const held=sess.filter(d=>!d.cancelled),heldH=held.reduce((s,d)=>s+(+d.hours||0),0),cx=sess.filter(d=>d.cancelled);
  const planned=(stats.find(x=>x.c.id===c.id)||{}).planned||0;
  let h=`<section class="sec">${chartSections()}
    <div class="sec-h"><div class="f" style="min-width:200px;flex:1"><label for="rs">سجل الشعبة</label><select id="rs" data-chg="regsec">${L.map(k=>`<option value="${esc(k.id)}"${k.id===c.id?' selected':''}>${esc(k.name)}</option>`).join('')}</select></div>
    ${dl?`<div class="inline"><button class="btn" data-act="xls" data-scope="one">تنزيل Excel</button><button class="btn" data-act="xls" data-scope="all">كل الشعب</button></div>`:''}</div>
    ${chartLectures(c)}
    <p class="hint num">${studs.length} طالبة · ${held.length} محاضرة مُحضّرة (${nf(heldH)} من ${nf(planned)} ساعة مقررة)${cx.length?` · ${cx.length} مُلغاة خُصمت من المجموع`:''}. اضغط تاريخ المحاضرة لتعديلها.</p>`;
  if(!studs.length){h+='<div class="card empty"><b>لا طالبات في الشعبة</b>ارفع كشف الشعبة من «الإعداد».</div>';return h+'</section>'}
  h+='<div class="regwrap"><table class="reg"><thead><tr><th class="nm">الطالبة</th>';
  for(const d of sess)h+=`<th class="${d.cancelled?'xc':''}"><button data-act="open" data-c="${esc(c.id)}" data-d="${d.date}" data-m="${esc(d.meetingId)}" title="${esc(fW.format(pd(d.date)))}${d.cancelled?' · مُلغاة':''}">${dm(d.date)}<br><span class="num">${d.cancelled?'ملغاة':nf(d.hours)+'س'}</span></button></th>`;
  h+='<th class="tot">غياب (س)</th><th class="tot">الحضور</th><th class="tot">الحالة</th></tr></thead><tbody>';
  studs.forEach((s,i)=>{const x=stMap.get(s.id);
    h+=`<tr><td class="nm"><span class="num" style="color:var(--muted)">${i+1}.</span> ${esc(s.name)}</td>`;
    for(const d of sess){if(d.cancelled){h+='<td class="m m-x">—</td>';continue}const m=(d.marks||{})[s.id];h+=`<td class="m m-${m||'n'}">${m?MK[m].t:'·'}</td>`}
    const cls=x&&x.level?LV[x.level].c:x&&x.cut?'cut':'ok';
    h+=`<td class="tot num">${x?nf(x.absH):0}</td><td class="tot num">${x?x.attPct:100}%</td><td class="tot"><span class="pill ${cls}">${x?statusTxt(x):'منتظمة'}</span></td></tr>`});
  h+='</tbody><tfoot><tr><td class="nm">الحاضرات</td>';
  for(const d of sess){if(d.cancelled){h+='<td>—</td>';continue}const v=Object.values(d.marks||{});h+=`<td class="num">${v.filter(m=>m==='p'||m==='l').length}</td>`}
  h+='<td colspan="3"></td></tr></tfoot></table></div></section>';
  return h;
}
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function loadXLSX(){return window.XLSX?Promise.resolve():loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js')}
async function exportXls(scope){
  try{await loadXLSX()}catch(e){toast('تعذّر تجهيز ملف Excel، تحقق من الاتصال');return}
  const stats=computeStats(),wb=XLSX.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const list=scope==='all'?secs():[cById(S.regSec)];const used=new Set();
  for(const c of list){const sess=sessOf(c.id),stMap=new Map(stats.filter(x=>x.c.id===c.id).map(x=>[x.s.id,x]));
    const head=['#','الرقم الجامعي','اسم الطالبة',...sess.map(d=>`${dm(d.date)} ${d.cancelled?'(ملغاة)':'('+nf(d.hours)+'س)'}`),'ساعات الغياب','بعذر (س)','نسبة الحضور %','الحالة'];
    const rows=[[c.name],[`الساعات المقررة: ${nf((stats.find(x=>x.c.id===c.id)||{}).planned||0)} — الحد الأدنى للحضور ${S.settings.minAttend}%`],[],head];
    sorted(c).forEach((s,i)=>{const x=stMap.get(s.id);rows.push([i+1,s.uid||'',s.name,...sess.map(d=>{if(d.cancelled)return '—';const m=(d.marks||{})[s.id];return m?MK[m].t:''}),x?x.absH:0,x?r2(x.eH):0,x?x.attPct:100,x?statusTxt(x):'منتظمة'])});
    const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:4},{wch:12},{wch:28},...sess.map(()=>({wch:10})),{wch:11},{wch:9},{wch:12},{wch:10}];
    let nm=(c.short||c.name).replace(/[\[\]:*?\/\\]/g,' ').slice(0,28)||'شعبة';while(used.has(nm))nm=nm.slice(0,26)+'_'+used.size;used.add(nm);
    XLSX.utils.book_append_sheet(wb,ws,nm)}
  const buf=XLSX.write(wb,{bookType:'xlsx',type:'array'});
  const fn=(scope==='all'?'سجل الحضور - كل الشعب':'سجل الحضور - '+(cById(S.regSec).short||'شعبة'))+' '+ymd(new Date())+'.xlsx';
  try{await dl.save({filename:fn,data:new Blob([buf])});toast('جُهّز الملف')}catch(e){if(e&&e.code!=='declined')toast('تعذّر تنزيل الملف')}
}

function msgFor(x){
  const st=x.level?LV[x.level].t:(x.cut?'انقطاع':'تنبيه غياب');
  let t=`الطالبة/ ${x.s.name}${x.s.uid?` (${x.s.uid})`:''}\n${x.c.name}\nالسلام عليكم ورحمة الله وبركاته،\nنفيدك بأن غيابك بلغ ${hrs(x.absH)} من أصل ${hrs(x.planned)} مقررة لهذا المقرر، أي أن نسبة حضورك ${x.attPct}% والحد الأدنى المطلوب ${S.settings.minAttend}%.`;
  if(x.cut)t+=`\nكما لم تحضري أي محاضرة منذ ${fS.format(pd(x.runStart))} (${x.runWeeks} أسابيع متصلة).`;
  t+=x.level===3?`\nنوع الإشعار: ${st}، لتجاوز الغياب الحد المسموح به.`:`\nنوع الإشعار: ${st}. المتبقي قبل الحرمان: ${hrs(Math.max(0,x.left))}.`;
  return t+`\nنأمل الالتزام بالحضور ومراجعة ${g('أستاذة','أستاذ')} المقرر.`;
}
function vAlerts(stats){

  const cnt=k=>all.filter(x=>(!sf||x.c.id===sf)&&(k==='deny'?x.level===3:k==='warn'?(x.level===1||x.level===2):(x.cut||!x.level))).length;

  if(!list.length)h+=`<div class="card empty"><b>${all.length?'لا طالبات في هذا التصنيف':'لا توجد طالبة تستحق تنبيهًا'}</b>تظهر التنبيهات تلقائيًا بعد كل تحضير.</div>`;
  else{h+='<div class="alerts">';
    for(const x of list){const id=skey(x),mx=Math.max(x.maxAbs*1.3,x.absH,1),w=Math.min(100,x.absH/mx*100),lim=x.maxAbs/mx*100;
      const cls=x.level?'l'+x.level:'cutonly';
      h+=`<article class="card al ${cls}"><span class="stripe"></span><div class="body">
        <div class="top1"><div><div class="name">${esc(x.s.name)}</div><div class="cls num">${esc(x.c.name)}${x.s.uid?' · '+esc(x.s.uid):''}</div></div>
        <div class="sum">${isNew(x)?'<span class="pill new">جديد</span>':''}${x.level?`<span class="pill ${LV[x.level].c}">${LV[x.level].t}</span>`:''}${x.cut?'<span class="pill cut">انقطاع</span>':x.runWeeks>0?`<span class="pill cut num">غياب متصل ${x.runWeeks} ${x.runWeeks<=2?'أسبوع':'أسابيع'}</span>`:''}</div></div>
        <div class="meter" title="ساعات الغياب، والخط هو حد الحرمان"><i style="width:${w.toFixed(1)}%"></i><s style="inset-inline-start:${lim.toFixed(1)}%"></s></div>
        <div class="facts num"><span>نسبة الحضور <b>${x.attPct}%</b></span><span>الغياب <b>${nf(x.absH)}</b> من ${nf(x.planned)} ساعة</span><span>${x.level===3?`<b style="color:var(--deny)">تجاوزت الحد (${nf(x.maxAbs)} س)</b>`:`متبقٍ قبل الحرمان <b>${nf(Math.max(0,x.left))}</b> س`}</span>
          ${x.eN?`<span>منها بعذر <b>${nf(x.eH)}</b> س${st.countExcused?'':' (غير محتسبة)'}</span>`:''}${x.lH?`<span>من التأخير <b>${nf(x.lH)}</b> س</span>`:''}${x.cut||x.runWeeks?`<span>آخر حضور قبل <b>${fS.format(pd(x.runStart))}</b></span>`:''}</div>
        ${x.abs.length?`<div class="absd num">تواريخ الغياب: ${x.abs.slice(-6).reverse().map(d=>esc(fS.format(pd(d)))).join('، ')}${x.abs.length>6?' …':''}</div>`:''}
        <div><button class="btn sm" data-act="copy" data-id="${esc(id)}">نسخ إشعار للطالبة</button></div>
        ${S.copyFor===id?`<textarea class="copybox" id="cb" readonly aria-label="نص الإشعار">${esc(msgFor(x))}</textarea>`:''}
      </div></article>`}
    h+='</div>'}
  h+=`<p class="rule">تُحسب بالساعات: الحرمان إذا نزلت نسبة الحضور عن <b>${st.minAttend}%</b> من ساعات المقرر (ساعات الشعبة الأسبوعية × <b class="num">${term()?term().weeks:'—'}</b> أسبوعًا، مطروحًا منها المحاضرات المُلغاة). الإنذار الأول عند <b>${st.warn1}%</b> غياب والثاني عند <b>${st.warn2}%</b>. الانقطاع: عدم حضور أي محاضرة <b class="num">${st.cutWeeks}</b> أسابيع متصلة. الغياب بعذر ${st.countExcused?'<b>يُحتسب</b>':'<b>لا يُحتسب</b>'} ضمن النسبة. ${st.lateEq>0?`كل <b class="num">${st.lateEq}</b> تأخيرات تُحتسب غياب محاضرة.`:'التأخير لا يُحتسب غيابًا.'}</p>`;
  return h+'</section>';
}

    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');
      pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}

    const rv=t=>[...t].reverse().join('');const list=[],pages=[];

    /* some PDFs store Arabic in visual order: decide once for the whole file */
    const allTxt=pages.flat().map(it=>clean(it.str)).join(' '),flip=looksRight(rv(allTxt))>looksRight(allTxt);
    const fixDir=t=>flip?rv(t).replace(/\d+/g,rv):t;let meta=null;
    for(const its of pages){
      const rows=new Map();
      for(const it of its){const str=clean(it.str);if(!str.trim())continue;const y=Math.round(it.transform[5]/3);
        if(!rows.has(y))rows.set(y,[]);rows.get(y).push({x:it.transform[4],str})}
      for(const items of rows.values()){
        const all=items.map(o=>o.str).join(' ');
        /* header: «الشعبة  الابتكار والتقنيات الناشئة-13384» */
        if(!meta){const hs=items.sort((a,b)=>b.x-a.x).map(o=>fixDir(o.str).trim()).filter(Boolean);

            const v=hs.filter(t=>!/^الشعبة\s*:?$/.test(t)).join(' ').replace(/الشعبة\s*:?/,'').trim();
            const sec=(v.match(/\d{3,7}/)||[''])[0],course=v.replace(sec,' ').replace(/[-–:]/g,' ').replace(/\s+/g,' ').trim();
            if(AR.test(course))meta={course,sec}}}const id=(all.match(/\b4\d{8}\b/)||all.match(/\b\d{7,10}\b/)||[])[0];if(!id)continue;
        const parts=items.sort((a,b)=>b.x-a.x).map(o=>o.str).map(fixDir).filter(t=>AR.test(t)&&!HDR.test(t)).map(t=>t.replace(STATUS,' '));
        const name=parts.join(' ').replace(STATUS,' ').replace(/\s+/g,' ').trim();
        if(name&&name.split(' ').length>=2)list.push({name,uid:id})}
    }
    const r=dedupe(c,list);r.meta=meta;
    if(!r.list.length)toast(r.dup?'كل الأسماء موجودة مسبقًا':'لم أستطع قراءة الأسماء من هذا الملف. جرّبي ملف Excel أو الصقي الأسماء.',4500);

const AR=/[؀-ۿ]/;
function fromRows(rows){
  rows=rows.map(r=>r.map(v=>normDigits(v))).filter(r=>r.some(v=>v));
  if(!rows.length)return[];
  const W=Math.max(...rows.map(r=>r.length));let nameCol=-1,idCol=-1,best=0,bestId=0;
  for(let j=0;j<W;j++){let ar=0,len=0,dg=0;for(const r of rows){const v=r[j]||'';if(AR.test(v)&&/\s/.test(v)){ar++;len+=v.length}if(/^\d{5,12}$/.test(v))dg++}
    const sc=ar*1000+len;if(ar>0&&sc>best){best=sc;nameCol=j}if(dg>bestId){bestId=dg;idCol=j}}
  if(nameCol<0)return[];
  return rows.map(r=>({name:(r[nameCol]||'').replace(/\s+/g,' ').trim(),uid:idCol>=0&&/^\d{5,12}$/.test(r[idCol]||'')?r[idCol]:''}))
    .filter(x=>x.name&&AR.test(x.name)&&!/^(الاسم|اسم الطالب|اسم الطالبة|الطالبة|الطالب)$/.test(x.name));
}
function fromText(txt){
  return txt.split(/\r?\n/).map(l=>normDigits(l)).filter(Boolean).map(l=>{const m=l.match(/\d{5,12}/);const uid=m?m[0]:'';
    const name=l.replace(/\d+/g,' ').replace(/[\t,;|.\-)(]+/g,' ').replace(/\s+/g,' ').trim();return{name,uid}}).filter(x=>x.name);
}
function dedupe(c,list){const have=new Set((c.students||[]).flatMap(s=>[s.uid&&'u'+s.uid,'n'+s.name.replace(/\s+/g,'')].filter(Boolean)));let dup=0;const out=[];

  try{let rows;
    if(/\.(csv|txt)$/i.test(file.name)){const txt=await file.text();rows=txt.split(/\r?\n/).map(l=>l.split(/[,;\t]/))}
    else{await loadXLSX();const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});rows=[];for(const n of wb.SheetNames)rows.push(...XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}))}
    const r=dedupe(c,fromRows(rows));
    if(!r.list.length){toast(r.dup?'كل الأسماء موجودة مسبقًا':'لم أجد عمود أسماء في الملف. جرّب لصق الأسماء.',3500);S.parsed[c.id]=null}
    else S.parsed[c.id]=r;
  }catch(e){toast('تعذّرت قراءة الملف. تحقق من الاتصال أو الصق الأسماء.',3500)}
  S.openCls=c.id;render();
}

/* does an uploaded roster look like it belongs to another section? */
function rosterWarn(c,P){
  if(!P)return '';const m=P.meta,ids=new Set(P.list.map(x=>x.uid).filter(Boolean));
  if(m&&m.sec&&c.secNo&&m.sec!==c.secNo)return `رقم الشعبة في الكشف (${m.sec}) يختلف عن رقم هذه الشعبة (${c.secNo}).`;
  if(ids.size){let best=null,n=0;for(const o of secs()){if(o.id===c.id)continue;const k=(o.students||[]).filter(s=>ids.has(s.uid)).length;if(k>n){n=k;best=o}}
    if(best&&n>=Math.max(3,ids.size*0.3))return `${n} من طالبات هذا الكشف موجودات في «${best.short||best.name}». يبدو أنه كشف شعبة أخرى.`}
  if(m&&m.course){const nm=c.name.replace(/\s+/g,'');if(!nm.includes(m.course.replace(/\s+/g,''))&&!(m.sec&&nm.includes(m.sec)))return `اسم المقرر في الكشف «${m.course}» لا يطابق اسم هذه الشعبة.`}
  return '';
}

/* ---------- render ---------- */
function render(){
  const ae=document.activeElement;
  if(ae&&$('view').contains(ae)&&/^(INPUT|TEXTAREA)$/.test(ae.tagName)&&!/date|time|file|checkbox/.test(ae.type)&&ae.value){S.needRender=true;renderHead(computeStats());return}
  S.needRender=false;
  const stats=computeStats();renderHead(stats);
  const v=$('view');
  if(S.status==='loading'||(S.status==='nodb'&&!S.classes.length)){v.innerHTML=`<div class="card empty"><b>${S.status==='nodb'?'السجل غير متاح هنا':'جارٍ تحميل السجل…'}</b>يظهر هنا يومك وجدولك وحضور طالباتك.</div>`;$('savebar').hidden=true;return}
  v.innerHTML=S.tab==='home'?vHome(stats):S.tab==='take'?vTake(stats):S.tab==='reg'?vReg(stats):S.tab==='alerts'?vAlerts(stats):S.tab==='exc'?vExc(stats):vManage();
  renderSavebar();
  if(S.tab==='alerts'){let ch=false;for(const x of stats)if((x.level||x.cut)&&S.seen[skey(x)]!==sig(x)){S.seen[skey(x)]=sig(x);ch=true}if(ch)lsSet(LS.seen,S.seen)}
}
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.needRender)render()},0));

/* ---------- actions ---------- */
function crossedMsg(before){
  const crossed=computeStats().filter(x=>{const b=before.get(skey(x));return b&&(x.level>b.level||(x.cut&&!b.cut))});
  return crossed.length?'تنبيه: '+crossed.map(x=>x.s.name.split(' ')[0]+' — '+(x.cut&&!before.get(skey(x)).cut?'انقطاع':LV[x.level].t)).join('، '):'';
}
function saveSheet(){
  const sh=S.sheet,c=cById(sh.classId),m=(c.meetings||[]).find(x=>x.id===sh.meetingId);
  const before=new Map(computeStats().map(x=>[skey(x),x]));
  const id=key(sh.classId,sh.date,sh.meetingId);
  const body={classId:sh.classId,date:sh.date,meetingId:sh.meetingId,start:m?m.start:'',hours:+sh.hours,marks:{...sh.marks},updatedAt:new Date().toISOString()};
  sh.dirty=false;sh.existing=true;queue(id,body);
  const msg=crossedMsg(before);render();
  toast(msg||('تم حفظ التحضير'),msg?5000:2400);
}
function cancelLecture(reason){
  const sh=S.sheet,c=cById(sh.classId),m=(c.meetings||[]).find(x=>x.id===sh.meetingId);
  const before=new Map(computeStats().map(x=>[skey(x),x]));
  queue(key(sh.classId,sh.date,sh.meetingId),{classId:sh.classId,date:sh.date,meetingId:sh.meetingId,start:m?m.start:'',hours:+sh.hours,cancelled:true,reason,marks:{},updatedAt:new Date().toISOString()});
  openSheet(sh.classId,sh.date,sh.meetingId);const msg=crossedMsg(before);render();
  toast(msg||`سُجّلت المحاضرة مُلغاة (${reason}) وخُصمت ${hrs(sh.hours)} من مجموع المقرر`,msg?5000:3200);
}
async function saveImport(){
  const I=S.imp,t=term(),list=I.sections.filter(s=>s.on&&s.meetings.length);if(!list.length){toast('اختر شعبة واحدة على الأقل');return}
  S.imp=null;let n=0;const base=Date.now();
  await write(async()=>{for(const s of list){const ex=secs().find(c=>c.name.replace(/\s+/g,'')===s.name.replace(/\s+/g,''));
      const meetings=s.meetings.map(m=>({id:rid('m'),day:m.day,start:m.start,end:m.end||'',room:m.room||'',hours:+m.hours||1}));
      if(ex)await db.doc('classes/'+ex.id).update({meetings,short:s.short||ex.short});
      else await db.doc('classes/'+rid('c')).set({term:t.id,name:s.name,short:s.short||s.name.slice(0,16),order:base+n,students:[],meetings});n++}},`حُفظت ${list.length} شعب. ارفع الآن كشف كل شعبة.`);
  render();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-tab],[data-act]');if(!t)return;
  if(t.dataset.tab&&!t.dataset.act){S.tab=t.dataset.tab;S.armed=null;render();window.scrollTo(0,0);return}
  const a=t.dataset.act;if(!['clearSample','delCls','delSheet','newTerm','addStu'].includes(a))S.armed=null;
  const c=t.dataset.c&&cById(t.dataset.c),I=S.imp;
  switch(a){
  case 'tab':S.tab=t.dataset.tab;render();window.scrollTo(0,0);return;
  case 'flush':flush();return;
  case 'open':openSheet(t.dataset.c,t.dataset.d,t.dataset.m);S.tab='take';render();window.scrollTo(0,0);return;
  case 'dnext':{const l=dhikrList(new Date().getHours());dIdx=((dIdx||0)+1)%l.length;dCount=0;dAnim=true;try{sessionStorage.setItem('reg.dIdx',dIdx)}catch(e){}render();return}
  case 'dcount':{dCount++;t.textContent=dCount.toLocaleString('ar-SA-u-nu-latn');try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}return}
  case 'backup':{const blob=new Blob([JSON.stringify(LDB.dump(),null,1)],{type:'application/json'});await dl.save({filename:'سجل الحضور - نسخة احتياطية '+ymd(new Date())+'.json',data:blob});lsSet('reg.lastBackup',Date.now());toast('نُزّلت النسخة الاحتياطية');return}
  case 'restoreGo':{LDB.load(S.restore.data);S.restore=null;S.sheet=null;toast('استُعيدت البيانات');S.tab='home';render();return}
  case 'restoreNo':S.restore=null;render();return;
  case 'regsel':S.regSec=t.dataset.c;render();return;
  case 'filter':S.filter=t.dataset.f;S.copyFor=null;render();return;
  case 'mark':S.sheet.marks[t.dataset.s]=t.dataset.m;S.sheet.dirty=true;render();return;
  case 'allP':for(const k in S.sheet.marks)S.sheet.marks[k]='p';S.sheet.dirty=true;render();return;
  case 'save':saveSheet();return;
  case 'cancelUI':S.cancelUI=!S.cancelUI;render();return;
  case 'cancel':cancelLecture(t.dataset.r);return;
  case 'uncancel':{const sh=S.sheet;queue(key(sh.classId,sh.date,sh.meetingId),null);openSheet(sh.classId,sh.date,sh.meetingId);S.sheet.existing=false;S.sheet.cancelled=false;render();toast('أُعيدت المحاضرة، يمكنك تحضيرها الآن');return}
  case 'delSheet':{if(S.armed!=='sheet'){S.armed='sheet';render();return}S.armed=null;const sh=S.sheet;queue(key(sh.classId,sh.date,sh.meetingId),null);openSheet(sh.classId,sh.date,sh.meetingId);render();toast('حُذف تحضير المحاضرة');return}
  case 'copy':{const id=t.dataset.id;S.copyFor=id;render();const x=computeStats().find(z=>skey(z)===id);
    try{await navigator.clipboard.writeText(msgFor(x));toast('نُسخ الإشعار')}catch(err){const cb=$('cb');cb&&(cb.focus(),cb.select());toast('حدّد النص وانسخه')}return}
  case 'xls':exportXls(t.dataset.scope);return;
  case 'impCancel':impCtl&&impCtl.abort();S.imp=null;render();return;
  case 'impSave':saveImport();return;
  case 'impRmMeet':I.sections[+t.dataset.i].meetings.splice(+t.dataset.j,1);render();return;
  case 'impAddMeet':I.sections[+t.dataset.i].meetings.push({day:0,start:'08:00',end:'09:50',room:'',hours:2});render();return;
  case 'saveProf':{const pf={title:$('pt').value,name:$('pn').value.trim()};write(()=>db.doc('config/settings').set({...S.settings,profile:pf}),'حُفظ');return}
  case 'saveTerm':{const name=$('tn').value.trim()||'الفصل الدراسي',start=$('ts').value,weeks=Math.max(1,parseInt($('tw').value,10)||15);
    if(!start){$('ts').focus();toast('حدد تاريخ أول أسبوع');return}
    const terms=[...S.settings.terms];const cur=term();let id=cur?cur.id:rid('t');
    if(cur)terms[terms.findIndex(x=>x.id===cur.id)]={id,name,start,weeks};else terms.push({id,name,start,weeks});
    write(()=>db.doc('config/settings').set({...S.settings,terms,currentTerm:id}),'حُفظ الفصل الدراسي');return}
  case 'newTerm':{if(S.armed!=='newterm'){S.armed='newterm';render();return}S.armed=null;const id=rid('t');
    write(()=>db.doc('config/settings').set({...S.settings,terms:[...S.settings.terms,{id,name:'فصل دراسي جديد',start:ymd(new Date()),weeks:15}],currentTerm:id}),'أُنشئ فصل جديد، حدّث بياناته');return}
  case 'addClsManual':{const id=rid('c');S.openCls=id;
    write(()=>db.doc('classes/'+id).set({term:term().id,name:'شعبة جديدة',short:'شعبة',order:Date.now(),students:[],meetings:[{id:rid('m'),day:0,start:'08:00',end:'09:50',room:'',hours:2}]}),'أُضيفت شعبة، عدّل اسمها ومواعيدها');return}
  case 'addMeet':{S.openCls=c.id;const used=new Set((c.meetings||[]).map(m=>m.day));const day=[0,1,2,3,4].find(d=>!used.has(d))??0;
    write(()=>db.doc('classes/'+c.id).update({meetings:[...(c.meetings||[]),{id:rid('m'),day,start:'08:00',end:'08:50',room:'',hours:1}]}));return}
  case 'rmMeet':S.openCls=c.id;write(()=>db.doc('classes/'+c.id).update({meetings:(c.meetings||[]).filter(m=>m.id!==t.dataset.mid)}),'حُذف الموعد');return;
  case 'addStu':{S.openCls=c.id;let r=S.parsed[c.id];
    if(r&&rosterWarn(c,r)&&S.armed!=='add:'+c.id){S.armed='add:'+c.id;render();toast('تأكدي أن الكشف لهذه الشعبة',3000);return}S.armed=null;
    if(!r){const ta=$('ta-'+c.id);const txt=ta.value;if(!txt.trim()){toast('ارفع الكشف أو الصق الأسماء أولًا');return}r=dedupe(c,fromText(txt));ta.value='';if(!r.list.length){toast('كل الأسماء موجودة مسبقًا');return}}
    S.parsed[c.id]=null;
    const students=[...(c.students||[]),...r.list.map(x=>({id:rid('s'),name:x.name,uid:x.uid}))].sort((a,b)=>coll.compare(a.name,b.name));
    const upd={students};if(r.meta&&r.meta.sec&&!c.secNo)upd.secNo=r.meta.sec;
    write(()=>db.doc('classes/'+c.id).update(upd),`أُضيفت ${r.list.length} طالبة ورُتّبن أبجديًا`);return}
  case 'useMeta':{const m=S.parsed[c.id]&&S.parsed[c.id].meta;if(!m)return;S.openCls=c.id;
    const name=(m.sec?'شعبة '+m.sec+' — ':'')+m.course,short=((m.sec||'')+' '+(m.course.split(/\s+/)[0]||'')).trim();
    write(()=>db.doc('classes/'+c.id).update(m.sec?{name,short,secNo:m.sec}:{name,short}),'تمت تسمية الشعبة من الكشف');return}
  case 'rmStu':S.openCls=c.id;write(()=>db.doc('classes/'+c.id).update({students:(c.students||[]).filter(s=>s.id!==t.dataset.s)}),'حُذفت الطالبة');return;
  case 'delCls':{const cid=t.dataset.c;if(S.armed!=='cls:'+cid){S.armed='cls:'+cid;S.openCls=cid;render();return}S.armed=null;
    const docs=allAtt().filter(d=>d.classId===cid).map(d=>d.id);
    write(async()=>{for(const id of docs)await db.doc('attendance/'+id).delete();await db.doc('classes/'+cid).delete()},'حُذفت الشعبة');return}
  case 'saveSet':{const o={...S.settings};for(const k of ['minAttend','warn1','warn2','cutWeeks','lateEq']){const v=parseInt($('st-'+k).value,10);if(!isNaN(v)&&v>=0)o[k]=Math.min(100,v)}
    o.countExcused=$('st-countExcused').checked;write(()=>db.doc('config/settings').set(o),'حُفظت القواعد');return}
  case 'clearSample':{if(S.armed!=='sample'){S.armed='sample';render();return}S.armed=null;
    const cls=S.classes.map(x=>x.id),att=allAtt().map(d=>d.id);S.sheet=null;
    write(async()=>{for(const id of att)await db.doc('attendance/'+id).delete();for(const id of cls)await db.doc('classes/'+id).delete();
      await db.doc('config/settings').set({...S.settings,sample:false})},'حُذفت الأمثلة، ارفع جدولك الآن');S.tab='manage';return}
  }
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset.chg,ik=t.dataset.imp;
  if(ik&&S.imp){const s=S.imp.sections[+t.dataset.i];
    if(ik==='on'){s.on=t.checked;render();return}
    if(ik==='name'||ik==='short'){s[ik]=t.value;return}
    const m=s.meetings[+t.dataset.j],f=ik.slice(2);m[f]=(f==='day'||f==='hours')?+t.value:t.value;
    if(f==='start'||f==='end'){const h=suggestH(m.start,m.end);if(h)m.hours=h;render()}return}
  if(!k)return;
  if(k==='sheet'){const cid=$('pc').value,d=$('pdt').value||ymd(new Date());let mid=$('pm')?$('pm').value:'';
    if(t.id!=='pm'){const c=cById(cid),dow=pd(d).getDay(),m=(c.meetings||[]).find(x=>x.day===dow);if(m)mid=m.id;if(t.id==='pc'&&!m)mid=''}
    openSheet(cid,d,mid);render();return}
  if(k==='hours'){S.sheet.hours=+t.value;S.sheet.dirty=true;render();return}
  if(k==='secf'){S.secFilter=t.value;render();return}
  if(k==='regsec'){S.regSec=t.value;render();return}
  if(k==='term'){const id=t.value;S.sheet=null;write(()=>db.doc('config/settings').set({...S.settings,currentTerm:id}));return}
  if(k==='restore'){const f=t.files&&t.files[0];if(!f)return;f.text().then(x=>{try{const o=JSON.parse(x);if(!o||typeof o!=='object'||!o.config)throw 0;
    S.restore={data:o,n:Object.keys(o.classes||{}).length,a:Object.keys(o.attendance||{}).length};render()}catch(e){toast('هذا ليس ملف نسخة احتياطية صالح')}});return}
  if(k==='sched'){if(t.files&&t.files.length)importSchedule([...t.files]);return}
  if(k==='file'){const c=cById(t.dataset.c);if(t.files[0])rosterFromFile(t.files[0],c);return}
  if(k==='cname'){const c=cById(t.dataset.c),v=t.value.trim();if(!v)return;S.openCls=c.id;write(()=>db.doc('classes/'+c.id).update({[t.dataset.k]:v}));return}
  if(k==='meet'){const c=cById(t.dataset.c);S.openCls=c.id;const f=t.dataset.k;
    const meetings=(c.meetings||[]).map(m=>{if(m.id!==t.dataset.mid)return m;const n={...m,end:endOf(m),[f]:(f==='day'||f==='hours')?+t.value:t.value};
      if(f==='start'||f==='end'){const h=suggestH(n.start,n.end);if(h)n.hours=h}return n});
    write(()=>db.doc('classes/'+c.id).update({meetings}));return}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d.matches&&d.matches('details.cls')&&d.open)S.openCls=d.dataset.cid},true);

/* ---------- boot ---------- */
const LDB=(()=>{const K='reg.db.v1';let st;try{st=JSON.parse(localStorage.getItem(K)||'{}')||{}}catch(e){st={}}
  const ls=new Set();const clone=o=>JSON.parse(JSON.stringify(o));
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){throw{code:'quota_exceeded'}}setTimeout(()=>ls.forEach(f=>f()),0)};
  const split=p=>{const a=p.split('/');return[a.slice(0,-1).join('/'),a[a.length-1]]};
  const snap=(c,id)=>{const v=(st[c]||{})[id];return{id,exists:!!v,data:()=>v?clone(v):undefined,metadata:{fromCache:false,hasPendingWrites:false}}};
  function doc(p){const[c,id]=split(p);return{id,path:p,
    async get(){return snap(c,id)},
    async set(d){(st[c]=st[c]||{})[id]=clone(d);save();window.onLocalWrite&&onLocalWrite(p)},
    async update(d){const cur=(st[c]||{})[id];if(!cur)throw{code:'invalid_argument'};Object.assign(cur,clone(d));save();window.onLocalWrite&&onLocalWrite(p)},
    async delete(){if(st[c])delete st[c][id];save();window.onLocalWrite&&onLocalWrite(p)},
    onSnapshot(n){const f=()=>n(snap(c,id));ls.add(f);setTimeout(f,0);return()=>ls.delete(f)}}}
  function collection(c){return{path:c,doc:id=>doc(c+'/'+(id||rid('d'))),
    onSnapshot(n){const f=()=>{const docs=Object.keys(st[c]||{}).map(id=>snap(c,id));n({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}})};ls.add(f);setTimeout(f,0);return()=>ls.delete(f)}}}
  return{doc,collection,dump:()=>clone(st),load:o=>{st={classes:o.classes||{},attendance:o.attendance||{},config:o.config||{}};save();window.onLocalWrite&&LDB.paths().forEach(p=>onLocalWrite(p))},
  raw:p=>{const[c,id]=split(p);const v=(st[c]||{})[id];return v?clone(v):null},
  paths:()=>Object.entries(st).flatMap(([c,o])=>Object.keys(o||{}).map(id=>c+'/'+id)),
  applyRemote:(p,data)=>{const[c,id]=split(p);if(data==null){if(st[c])delete st[c][id]}else{(st[c]=st[c]||{})[id]=data}save()}}})();
async function boot(){
  S.outbox=lsGet(LS.out)||{};S.seen=lsGet(LS.seen)||{};
  db=LDB;S.live=true;
  dl={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},1500);return{status:'saved'}}};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const done=()=>{if(S.got.c&&S.got.a&&S.got.s){S.status='ready';flush()}render()};
  db.collection('classes').onSnapshot(q=>{S.classes=q.docs.map(d=>({id:d.id,...d.data()}));S.got.c=1;
    if(S.sheet&&!S.sheet.dirty&&cById(S.sheet.classId))openSheet(S.sheet.classId,S.sheet.date,S.sheet.meetingId);done()});
  db.collection('attendance').onSnapshot(q=>{S.att=q.docs.map(d=>({id:d.id,...d.data()}));S.got.a=1;
    if(S.sheet&&!S.sheet.dirty){const d=allAtt().find(x=>x.id===key(S.sheet.classId,S.sheet.date,S.sheet.meetingId));S.sheet.existing=!!d;S.sheet.cancelled=!!(d&&d.cancelled);S.sheet.reason=d&&d.reason||''}done()});
  db.doc('config/settings').onSnapshot(d=>{S.settings={...DEF,...(d.exists?d.data():{})};S.got.s=1;done()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
render();boot();
